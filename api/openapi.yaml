  /payment-arrangements/{arrangementId}/release:
    post:
      operationId: recordPaymentRelease
      tags: [Payments, Admin]
      summary: Record a payment release (manual ops or future API capability)
      description: |
        Admin/ops manually records a release audit entry (QA-001). **Preconditions (409 else):**
        - Booking `completionStatus` must be `completed` (shipper delivery acceptance with
          POD present, **or** admin dispute resolution that completes the trip with audit).
        - Must **not** be in `disputed` (QA-005 holds release while disputed).
        - Arrangement must exist; for protected/escrow methods, protection evidence on file.

        `releaseChannel`: `manual_ops` (MVP only path that may succeed) or `provider_api`
        (future capability flag — recording still does not claim live integration or funds movement).

        **Never claims Truber moved funds. No float. No live provider API.** Commission 5%
        is server-computed, half-up on positive `tripAmount` (do not trust a client-supplied
        commission figure). The commission base is the effective agreed amount
        (`Booking.adjustedAgreedAmount` when set, else `Booking.agreedAmount`; v0.5.0); a
        supplied `tripAmount` that differs returns 409
        `TRIP_AMOUNT_MISMATCH`. `processingFeesTotal` must equal the sum of already-recorded
        transaction `processingFee` values on this arrangement in the same currency, or the
        server returns 409; do not blindly trust a typed total. Mixed-currency amounts are
        rejected (400/409). If commission + processing fees would make
        `transporterNetAmount` negative, return 409 `NET_PAYOUT_NEGATIVE`.

        `transporterNetAmount = tripAmount − commissionAmount − processingFeesTotal`
        (integer minor units, same currency). The shipper paid (or owes) the agreed trip
        amount; commission and recorded processing fees come out of the transporter payout.

        Commission was already recognised at trip completion. For methods where trip funds
        were held and this release deducts commission from those funds, this record settles
        the open commission receivable (`settled_on_release`). For `cash`, this record must
        **not** create a transporter payout due for the fare (Truber never held the money)
        and must **not** settle the commission receivable — cash commission stays `open`
        until `recordCommissionCollection`. Corporate-credit payout remains blocked until
        the shipper payment is recorded (no Truber float). For `deposit_balance`, do not
        treat an unreceipted balance remainder as payable and do not include it in a
        transporter payout; only receipted amounts may be released. Paying an unreceipted
        remainder would be lending.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ArrangementId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordPaymentReleaseRequest'
      responses:
        '201':
          description: Release record created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentReleaseRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

