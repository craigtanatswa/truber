  /payment-arrangements/{arrangementId}/confirm:
    post:
      operationId: confirmPaymentArrangement
      tags: [Payments]
      summary: Server-side confirm a payment arrangement (admin/ops for MVP)
      description: |
        Confirms the arrangement after Truber has verified the plan. **MVP: admin/ops only.**
        Clients cannot self-confirm payment or protection.

        Method preconditions (409 otherwise):
        - `deposit_balance`: a deposit **receipt** must already be recorded
          (`POST .../deposit-receipt`) — provisional policy §4.
        - `corporate_credit`: shipper company credit account must be `approved` and an
          **atomic** capacity reservation for `totalAmount` must succeed (QA-011).
        - `escrow`: `protectionStatus=protected` with independent-provider evidence
          (attachable here by admin only).
        - `cash`: `protectionStatus` remains `none`.
        - `prepay`: arrangement plan verified; transaction records remain separate.

        On success: `arrangementStatus=confirmed`. Does not confirm the booking.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ArrangementId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPaymentArrangementRequest'
      responses:
        '200':
          description: Arrangement confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentArrangement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /payment-arrangements/{arrangementId}/protection-evidence:
    post:
      operationId: recordProtectionEvidence
      tags: [Payments, Admin]
      summary: Record independent-provider secured-funds evidence (admin/ops)
      description: |
        Attaches evidence that an authorised independent provider is holding funds for
        an escrow (or similar protected) arrangement. Sets `protectionStatus=protected`
        only when evidence is accepted by server rules.

        Never available to shipper/transporter as a self-asserted protection claim.
        Does not integrate live Paynow/EcoCash/InnBucks APIs in MVP — stores references
        and notes only. Cash arrangements reject this call (400/409).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ArrangementId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProtectionEvidenceRequest'
      responses:
        '200':
          description: Evidence recorded; protection status updated when rules pass
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentArrangement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /payment-arrangements/{arrangementId}/transactions:
    get:
      operationId: listPaymentTransactions
      tags: [Payments]
      summary: List payment transaction records under an arrangement
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ArrangementId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentTransactionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: recordPaymentTransaction
      tags: [Payments, Admin]
      summary: Record a payment transaction (admin/ops; MVP records only)
      description: |
        Records that money moved (or failed) according to external proof. Updates
