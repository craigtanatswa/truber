openapi: 3.0.3
info:
  title: Truber API
  version: 0.5.0
  description: |
    Truber API **v0.5.0** — **authoritative** contract (published 2026-11-11 Africa/Harare).
    User approval: launch-scope decisions in Charlie's chat, 2026-11-11 16:15 Africa/Harare
    ("Publish v0.5.0: approved with these answers"), plus the commission-adjustment answer in
    Charlie's chat, 2026-11-11 16:20 Africa/Harare. Built from published v0.4.0 (SHA-256
    `7f44d228ba8129398a9d2790e3e08770efbfed381fab7be391bef592f38221f4`, archived as
    `api/archive/openapi-v0.4.0.yaml`) plus reviewed draft rev 4 (SHA-256
    `cd7218e74586ed12e1e72bbdba70529fdf7ed78bf522abdfdcd606f6050d4dc3`) and the user decisions
    below. Change log: `api/CHANGELOG.md`.

    v0.5.0 changes:
    - New `getBookingPayoutBreakdown` (`GET /bookings/{bookingId}/payout-breakdown`):
      transporter + admin read of agreed amount, 5% commission, recorded fees, net payout,
      payment method, protection, release status and payout blockers. **Shippers never see
      the payout breakdown** (user decision 2026-11-11): they get 404, and transaction
      `processingFee` values are null for shipper-side callers.
    - New `previewQuotationPayout` (`POST /quotations/payout-preview`): side-effect-free
      net-payout preview for a proposed quote amount. Provider fees are not confirmed, so
      they are reported as unknown, never as 0. Allowed while banned or owing; returns
      `submissionBlockers` (`ACCOUNT_BANNED`, `COMMISSION_OUTSTANDING`) for UI warnings.
    - `getBookingPayoutBreakdown` never returns 409: a negative net is 200 with `netPayout`
      null and `net_payout_negative` in `payoutBlockedReasons`.
    - `CommissionReceivable.commissionRateBps` is required and immutable (rate at recognition).
    - `Booking.agreedAmount` is the canonical agreed price. `PaymentReleaseRecord.tripAmount`
      is a copy of the effective agreed amount; `RecordPaymentReleaseRequest.tripAmount`
      becomes optional and must equal it when sent (409 `TRIP_AMOUNT_MISMATCH`).
      `PaymentReleaseRecord.commissionRateBps` becomes required and immutable.
    - New `listOwnOffPlatformReports` (`GET /off-platform-reports`): the caller lists only
      reports they themselves filed. No admin notes, findings, evidence, or reports filed
      about the caller.
    - **Counterparty ban notice** (user decision 2026-11-11: "tell the other party when
      someone is banned"): `counterpartyRestrictedUntil` on `Quotation` and `Truck`, and the
      notification events in `x-notification-events` (`counterparty_restricted`,
      `counterparty_restriction_lifted`). Only the company and the end date are disclosed;
      never the reason, finding, report, evidence, or who reported.
    - **Completion, dispute window and commission adjustments** (user decision 2026-11-11
      16:20 and 16:24): the shipper's delivery acceptance (with POD) completes the trip and
      opens a **24-hour dispute window** (`Booking.deliveryConfirmedAt`, `Booking.disputeWindowEndsAt`).
      If no dispute is raised, the trip locks (`completionStatus=locked`, `lockedAt`) and
      the 5% commission is final. The shipper opens disputes only inside the window
      (`raiseBookingDispute`); the transporter is notified at once and has **48 hours**
      (`responseDueAt`) to respond with evidence or a counter-offer (`respondToDispute`).
      The parties may settle by accepting an offer (`acceptDisputeSettlement`, recorded as an
      adjustment); otherwise an admin decides on both sides' evidence, or on what is there
      if the transporter did not respond (`resolveBookingDispute`). Both sides see the
      outcome and reason (`listBookingDisputes`). An open dispute keeps the trip unlocked.
      After lock there are no voids or cancellations; an admin resolves later problems as
      **adjustments** (`recordBookingAdjustment`), never an undo.
      Commission follows the money: when an admin reverses or reduces a trip, the commission
      difference first cancels or reduces unpaid owing on that trip, and any part already
      paid becomes **commission credit** on the transporter's Truber balance
      (`CommissionAccount.creditByCurrency`): credit is applied to future commission and, where server policy allows, to outstanding commission. Credit is
      **never paid out or refunded in cash** and is not money held by Truber. Each
      change is an append-only `CommissionAdjustment` (`source: party_settlement` or
      `admin_decision`; `listCommissionAdjustments`). While a dispute is open the
      receivable is `held`: not final, and held commission does not block work (excluded
      from `outstandingByCurrency` and the commission gate). Overpaid commission
      collections also become credit (`CommissionCollectionRecord.creditedAmount`). Example: on a US$1,000 trip an admin cuts the agreed amount to US$500;
      commission drops from US$50 to US$25 and US$25 is credited (or, on a cash trip whose
      commission is unpaid, US$25 of owing is cancelled instead).
    - **Repeat abuse** of disputes or reversals is reviewed through the existing
      report/finding flow (`category: repeated_dispute_abuse`, admin-filed) and gets the same
      fixed 14-day ban as off-platform dealing.

    Launch payment posture (user decision 2026-11-11): payments at launch are **recorded**
    (cash, or a transfer recorded against `prepay` / `deposit_balance`) and are **not
    payment-protected** unless independent-provider evidence exists (`escrow` only). A Paynow
    integration will be built and tested in test mode without real money; no Paynow
    operation, credential or merchant detail is part of this contract version, and
    `providerHint` is still not proof of an integration. Support is by email; the support
    address, email sender and domain come from deployment configuration and are never
    hard-coded in clients or in this contract.

    --- Carried forward from v0.4.0 (still in force unless changed above) ---

    Truber API v0.4.0 (superseded by v0.5.0; published 2026-11-10 Africa/Harare).
    User approval: publish card reply `Yes, publish v0.4.0` (Charlie transcript, 2026-11-10 09:35).
    Published from reviewed draft SHA-256
    `b731748ca23c7d0f5f6c145617cfafcc5a69dd4555018251aca8d4a6033fc38b` (Mark and Charlie sign-off).
    Supersedes v0.3.0 (SHA-256 `f0a8a9164e72b17afac29f5b9792864def73808ca8d1c9a5e45333da696c2915`).
    Approved draft snapshot: `api/releases/openapi-v0.4.0-draft-approved-snapshot.yaml`.
    Previous v0.3.0 backup: `api/releases/openapi-v0.3.0.yaml`.

    Adds off-platform cancellation safeguards (**user-approved 2026-11-10**, card reply in
    Charlie's chat 09:09 Africa/Harare: "Yes, approve the rule with a 14-day ban"; proposal
    `reports/off-platform-safeguards.md` with a 14-day ban instead of 30):
    - After a quotation is accepted or a booking exists (including
      `pending_payment_arrangement`), shippers and transporters cannot cancel the booking
      themselves. Only admin records a cancellation, with an audited reason
      (`cancelBooking`). Self-cancel paths (`cancelLoad` once a booking exists,
      `withdrawQuotation` on an accepted quotation, a party calling `cancelBooking`) return
      409 `SelfCancelNotAllowedError` (`code: SELF_CANCEL_NOT_ALLOWED`).
    - Report-and-review: a booking party or ops/admin may report suspected off-platform
      circumvention on a booking (`createOffPlatformReport`). Admin reviews and records a
      finding (`confirmed` / `not_confirmed`) with a reason and audit record
      (`recordOffPlatformFinding`). Nothing is automatic; legitimate cancels never ban anyone.
    - A confirmed finding applies a ban (admin only) to each responsible user **and** their
      company (shipper, transporter, or both). Duration is fixed at **14 days** from
      application (`endsAt = startsAt + 14 days`); not client-configurable. Time-limited, not
      permanent `disabled`; `accountStatus` is not changed by a ban.
    - While banned, existing records stay visible, but `createLoad`, `postLoad`,
      `createQuotation`, `acceptQuotation`, and `confirmBooking` return **409**
      `AccountBannedError` (`code: ACCOUNT_BANNED`, required `details.bannedUntil`). Admin
      `auditOverride` cannot bypass the ban.
    - Admin may lift a ban early with an audited reason (`liftOffPlatformBan`). A ban expires
      automatically at `endsAt`.
    - Separate from the commission-owing gate (billing semantics unchanged). When both apply,
      `ACCOUNT_BANNED` is returned first.

    Also changes access-token lifetime to **1800 seconds (30 minutes)**
    (**user-approved 2026-11-07**, "I approve them but increase sign in sessions to 30
    minutes"; owner Mark). Password-reset TTL stays 30 minutes.

    Retained from published v0.3.0 — user-approved billing rules (2026-11-09, user chat with Jensen):
    - Shipper pays the agreed trip amount. Commission and recorded processing fees are
      deducted from the transporter payout (not added on for the shipper).
    - Commission 5% is recognised when the trip is completed (after proof of delivery is
      confirmed), not when payment is released.
    - On cash trips, the transporter still owes Truber the 5% as an amount collected later.
    - A transporter with unpaid commission owing can view loads but cannot submit a
      quotation (`createQuotation`), have a quotation accepted (`acceptQuotation`), or
      confirm a booking (`confirmBooking`) until the owing is settled. The 409 is
      `CommissionOutstandingError` and prompts payment first. Admin override cannot
      bypass this gate. Already-confirmed bookings are unaffected.
    - Owing and collections are per currency. The accept-block is not currency-scoped:
      `createQuotation`, `acceptQuotation`, and `confirmBooking` are blocked whenever
      any currency has remaining owing. An unreceipted `deposit_balance` remainder is
      not payable (no Truber lending).

    **Not implemented:** no NestJS runtime, no live Paynow/EcoCash/InnBucks/BuySafe integrations.
    Live payment APIs remain unresolved. Access-token lifetime is 30 minutes in this contract
    (user-approved 2026-11-07). Off-platform safeguards and 14-day bans are encoded in this
    contract (user-approved 2026-11-10); no runtime enforcement exists yet.

    Hard rules retained/strengthened from v0.1.0:
    - Public signup never grants `admin`.
    - Booking confirm requires server-confirmed payment arrangement for the same booking;
      escrow requires `protectionStatus=protected` with independent-provider evidence.
      **Shipper** is the primary booking confirmer; **admin** may act with an audit record but
      **never bypasses** the payment-arrangement / protection gate.
    - Clients cannot self-confirm payment or protection.
    - Cash never protected. No Truber wallet/float. No live Paynow/EcoCash/InnBucks APIs.
    - Release is a manually recorded ops audit only; recording never claims funds moved.
    - Commission 5% half-up to minor unit; recognised at trip completion (user-approved 2026-11-09).
    - Processing fees are recorded separately and deducted from the transporter payout
      together with commission (user-approved 2026-11-09). Fee payer is the transporter.
    - Deposit splits are configurable (example 50/50); no fixed rate in the contract.
    - POD and shipper delivery confirmation are distinct; trip completion ≠ release.

  contact:
    name: Truber Backend
  license:
    name: Proprietary
    url: https://truber.example/license

x-notification-events:
  description: |
    Server-side notification events (v0.5.0). Delivered through the configured notification
    channel (email at launch; provider, sender and support address from deployment
    configuration, never hard-coded). This contract performs no real send: when no channel
    is configured the event is recorded and not delivered. Events are emitted after the
    triggering transaction commits (outbox); a delivery failure never rolls back or blocks
    the finding, lift, or any other write. There is no public notification API in v0.5.0;
    clients also learn the state from `counterpartyRestrictedUntil`.
  events:
    counterparty_restricted:
      trigger: |
        `recordOffPlatformFinding` with outcome `confirmed` applies one or more bans
        (user decision 2026-11-11: the other party is told when someone is banned).
      recipients: |
        Members of each company that is a counterparty of a newly banned company:
        (1) the other party on the reported booking, unless that party is itself banned by
        the same finding; (2) companies with an `open` quotation or a
        `pending_payment_arrangement` booking with the banned company. Each recipient
        company is notified at most once per finding. The banned users and companies are not
        sent this event (they see their own `bannedUntil`).
      payload: |
        `event`, `restrictedCompanyId`, `restrictedCompanyName`, `restrictedUntil` (ban
        `endsAt`), and only the recipient's own affected `bookingIds` / `quotationIds`.
        Never included: ban or finding reason, report id or text, evidence, admin notes,
        which user was banned, or who reported.
    counterparty_restriction_lifted:
      trigger: '`liftOffPlatformBan` lifts a ban early.'
      recipients: The same recipient set as `counterparty_restricted` for that ban.
      payload: |
        `event`, `restrictedCompanyId`, `restrictedCompanyName`, `restrictedUntil: null`.
        No reason. Natural expiry at `endsAt` sends no event.
    dispute_opened:
      trigger: '`raiseBookingDispute`, or `confirmDelivery` with `decision: disputed`.'
      recipients: Members of the booking's transporter company, immediately.
      payload: |
        `event`, `disputeId`, `bookingId`, `reason`, `responseDueAt` (openedAt + 48 hours),
        `proposedAmount` (or null). Evidence is linked, not attached.
    dispute_responded:
      trigger: '`respondToDispute`.'
      recipients: Members of the booking's shipper company.
      payload: '`event`, `disputeId`, `bookingId`, `counterOfferAmount` (or null).'
    dispute_settled:
      trigger: '`acceptDisputeSettlement`.'
      recipients: Members of both booking companies.
      payload: '`event`, `disputeId`, `bookingId`, settled `amount`.'
    dispute_resolved:
      trigger: '`resolveBookingDispute`.'
      recipients: Members of both booking companies.
      payload: |
        `event`, `disputeId`, `bookingId`, `outcome`, `reason`, `adjustedAgreedAmount`
        (or null). Never commission or payout figures.

servers:
  - url: https://api.truber.example/v0
    description: Placeholder base URL (not deployed)

tags:
  - name: Auth
    description: |
      Registration, email+password login, token refresh, password reset, OTP verification,
      current user. MVP authentication is email+password only — OTP is never passwordless login.
  - name: Users
    description: User profiles and admin user management
  - name: Companies
    description: Shipper and transporter company profiles
  - name: Trucks
    description: Transporter fleet registration
  - name: Loads
    description: Shipper load posting and lifecycle
  - name: Quotations
    description: Transporter quotations against loads
  - name: Bookings
    description: Booking pending then confirm with payment arrangement
  - name: Payments
    description: Payment arrangements, commission receivables, and records (MVP records only)
  - name: ProofOfDelivery
    description: Transporter POD uploads
  - name: DeliveryConfirmation
    description: Shipper delivery acceptance (distinct from POD)
  - name: Ratings
    description: Post-completion ratings
  - name: Admin
    description: Restricted admin provisioning and ops release recording
  - name: Safeguards
    description: |
      Off-platform circumvention reports, admin findings, and 14-day bans
      (user-approved 2026-11-10).

paths:

  /auth/register:
    post:
      operationId: registerUser
      tags: [Auth]
      summary: Public registration (shipper or transporter only)
      description: |
        Creates a user with role `shipper` or `transporter` only.
        Requests that specify `admin` (or any other role) are rejected with 400.
        Does not authenticate as admin under any circumstance.
        New users start as `pending_verification` and must complete OTP + docs before
        company verification unlocks posting/quoting (QA-010 / QA-006). Tokens may still
        be issued for onboarding flows.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Email+password login (MVP sole login method)
      description: |
        MVP login is **email + password** only. OTP endpoints are for phone/account
        verification after registration — they are **never** a passwordless login path.
        Invalid credentials return a generic 401 (do not reveal whether the email exists).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [Auth]
      summary: Rotate access token using a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [Auth]
      summary: Return the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [Auth]
      summary: Request password-reset email (public; anti-enumeration)
      description: |
        Public endpoint (`security: []`); no preexisting login required.

        Accepts an email address. Always returns the **same** generic `202` body whether or
        not an account exists, whether or not email is deliverable, and whether account-level
        internal throttling suppresses a send. Response **never** includes a reset token,
        user id, or account-existence hint. Observable timing/body/status must not enumerate
        accounts.

        **Delivery:** If a reset is warranted, the opaque single-use token is delivered only
        through the **configured email channel**. This contract does **not** perform a real
        send; implementations stub/queue accordingly. Deliverability failures (bounce, missing
        mailbox, provider outage) are handled **uniformly** with the same `202` — clients
        cannot distinguish them from "no account" or "throttled for this account".

        **Throttling:** Account-specific send suppression (if any) must preserve the generic
        `202` (no distinct status). A legitimate **per-source** abuse guard may return generic
        `429` with the shared `Error` shape when the caller/IP/device exceeds limits — that
        `429` must not encode whether the email belongs to an account.

        Reset tokens have a **finite configured TTL**. Tokens are single-use and consumed
        atomically on successful confirm.

        **User-approved 2026-11-07:** password-reset token TTL = **30 minutes**.
        Access-token (sign-in session) lifetime is **30 minutes** (`expiresIn` 1800,
        user-approved 2026-11-07; encoded in v0.4.0). See AUTH-NOTES / release notes. Live payment APIs remain unresolved.
        Fee payer is the transporter (user-approved 2026-11-09; billing change only — this
        operation is unchanged).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: |
            Generic acceptance. Identical for existing/unknown emails, deliverability
            failures, and account-level send suppression. Never returns a token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetRequestAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          description: |
            Per-source abuse rate limit (generic). Must not reveal account existence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [Auth]
      summary: Confirm password reset with opaque token (public)
      description: |
        Public endpoint (`security: []`); no preexisting login required.

        Body: opaque reset `token` (from email channel only) + `newPassword` (shared
        `Password` policy). On success: password is changed **once**; the token is marked
        consumed **atomically** (concurrent confirms: at most one succeeds); **all existing
        refresh sessions** for that user are invalidated immediately.

        **Session semantics (approved with API v0.2.0 publish, 2026-11-07; originated as
        Charlie provisional):**
        - All **refresh sessions** for the user are revoked immediately on success.
        - **Access JWTs** are **not** immediately denylisted; they remain usable until
          natural expiry (`AuthTokenResponse.expiresIn`). **Residual access exposure**
          therefore lasts until that access token expires (30 minutes — see `expiresIn`;
          user-approved 2026-11-07).
          Clients must not treat reset as instant access kill.
        - This endpoint still does not issue new session tokens; client must `/auth/login`
          afterward with the new password.

        Token failures (unknown, expired, already consumed, malformed) return the **same**
        pinned `401` body (`PasswordResetConfirmTokenError`) — clients must not distinguish
        causes. Do not log or echo tokens or passwords.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '200':
          description: Password changed; refresh sessions invalidated; token consumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetConfirmResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: |
            Generic token failure for invalid, expired, consumed, or malformed tokens.
            Body MUST match `PasswordResetConfirmTokenError` exactly (one pinned code and
            message). Implementations must not vary code/message by token state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetConfirmTokenError'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          description: Per-source abuse rate limit (generic)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/users:
    post:
      operationId: provisionAdminUser
      tags: [Admin, Users]
      summary: Provision an admin user (admin-only)
      description: |
        The only path in this contract that creates a user with role `admin`.
        Callers must already hold `admin`. Public signup must never reach this endpoint.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionAdminRequest'
      responses:
        '201':
          description: Admin user created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /users/{userId}:
    get:
      operationId: getUser
      tags: [Users]
      summary: Get a user by id
      description: |
        Self, same-company member, or admin. Non-admins cannot read arbitrary users.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateUser
      tags: [Users]
      summary: Update a user profile
      description: Self may update display fields; admin may also change `accountStatus`. Role cannot be escalated to admin via this endpoint.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /companies:
    get:
      operationId: listCompanies
      tags: [Companies]
      summary: List companies visible to the caller
      description: |
        Shippers/transporters see their own companies. Admins may filter all companies.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/CompanyType'
        - name: verificationStatus
          in: query
          schema:
            $ref: '#/components/schemas/VerificationStatus'
      responses:
        '200':
          description: Paginated companies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createCompany
      tags: [Companies]
      summary: Create a company for the authenticated shipper or transporter
      description: Caller becomes an owner member. Admin may create on behalf of a user via `ownerUserId`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyRequest'
      responses:
        '201':
          description: Company created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /companies/{companyId}:
    get:
      operationId: getCompany
      tags: [Companies]
      summary: Get a company
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
