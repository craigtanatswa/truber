  /bookings/{bookingId}/trip-status:
    post:
      operationId: updateBookingTripStatus
      tags: [Bookings]
      summary: Advance trip operational status (transporter)
      description: |
        Transporter updates operational progress after booking is `confirmed`.
        Allowed transitions (MVP): confirmed → truck_dispatched → goods_collected →
        in_transit → delivered. `delivered` means transporter asserts delivery and may
        attach POD separately; it does **not** complete the trip or release payment.
        Shipper acceptance is a separate endpoint.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'
