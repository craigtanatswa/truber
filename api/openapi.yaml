      responses:
        '200':
          description: Load
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Load'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateLoad
      tags: [Loads]
      summary: Update a draft or posted load (shipper owner)
      description: |
        Shipper owning company may edit while status is `draft` or `posted` (before a booking
        is pending/confirmed). Admins may edit for operational fixes. Status transitions that
        post/cancel/close use dedicated action endpoints where defined.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LoadId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLoadRequest'
      responses:
        '200':
          description: Updated load
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Load'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /loads/{loadId}/post:
    post:
      operationId: postLoad
      tags: [Loads]
      summary: Transition load from draft to posted
      description: |
        Makes the load visible for transporter quotations.
        **Verification gate (QA-006):** shipper company `verificationStatus` must be `verified`
        and calling user's `accountStatus` must be `active`; otherwise 403 with verify-needed semantics.
        **Off-platform ban gate (user-approved 2026-11-10):** if the calling user or the load's shipper company has an active
        off-platform ban (`startsAt <= now < endsAt`, not lifted), return **409**
        `AccountBannedError` (`code: ACCOUNT_BANNED`, required `details.bannedUntil`).
        Existing records stay visible. Checked before the commission-owing gate.
        ("Cannot post loads" covers both `createLoad` and this transition.)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LoadId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Load posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Load'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AccountBannedOrConflict'

  /loads/{loadId}/cancel:
    post:
      operationId: cancelLoad
      tags: [Loads]
      summary: Cancel a load
      description: |
        Allowed for shipper owner while no booking exists for the load (status `draft`,
        `posted`, or `quoting`).
        After booking confirmation, use admin `POST /bookings/{bookingId}/cancel` to record
        cancellation (QA-004 provisional Charlie policy — not user-approved).
        **No self-cancel (user-approved 2026-11-10):** once a quotation is accepted or any
        non-cancelled booking exists for the load (including `pending_payment_arrangement`,
        i.e. load status `booking_pending` or later), this endpoint returns **409**
        `SelfCancelNotAllowedError` (`code: SELF_CANCEL_NOT_ALLOWED`). Only admin may record
        the booking cancellation, with an audited reason, via `cancelBooking`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LoadId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelReasonRequest'
      responses:
        '200':
          description: Load cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Load'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SelfCancelOrConflict'

  /loads/{loadId}/quotations:
    get:
      operationId: listQuotationsForLoad
      tags: [Quotations]
      summary: List quotations for a load
      description: Shipper owner and admin see all; transporters see only their own quotations.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LoadId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated quotations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createQuotation
      tags: [Quotations]
      summary: Submit a quotation (transporter)
      description: |
        Load must be `posted` or `quoting`. One open (`submitted`) quotation per transporter
        company per load (409 on duplicate — amendments via withdraw+resubmit still open).
        **Verification gate (QA-006):** transporter company must be `verified`, caller account
        `active`, and if `truckId` is supplied that truck must be `verified`; otherwise 403/409.
        Quotation `amount` must be strictly positive (QA-007).
        **Commission owing gate (user-approved 2026-11-09):** if the transporter company has
        unpaid commission remaining in any currency, return **409**
        `CommissionOutstandingError` (pinned `code: COMMISSION_OUTSTANDING`; required
        `details.outstandingByCurrency`; `details.outstandingAmount` also required when
        owing is in exactly one currency). The transporter may
        still list and view loads. The client should prompt them to settle the owing first.
        Existing confirmed bookings are not blocked. Same gate as `acceptQuotation` and
        `confirmBooking`.
        **Off-platform ban gate (user-approved 2026-11-10):** if the calling user or the transporter company (`transporterCompanyId`) has an active
        off-platform ban (`startsAt <= now < endsAt`, not lifted), return **409**
        `AccountBannedError` (`code: ACCOUNT_BANNED`, required `details.bannedUntil`).
        Existing records stay visible. Checked before the commission-owing gate.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LoadId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuotationRequest'
      responses:
        '201':
          description: Quotation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/NewWorkGateConflict'

  /quotations/{quotationId}:
    get:
      operationId: getQuotation
      tags: [Quotations]
      summary: Get a quotation
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/QuotationId'
      responses:
        '200':
          description: Quotation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /quotations/{quotationId}/withdraw:
    post:
      operationId: withdrawQuotation
      tags: [Quotations]
      summary: Withdraw a quotation (transporter)
      description: |
        Transporter withdraws its own `submitted` quotation.
        **No self-cancel (user-approved 2026-11-10):** an `accepted` quotation (a booking
        exists, including `pending_payment_arrangement`) cannot be withdrawn. Return **409**
        `SelfCancelNotAllowedError` (`code: SELF_CANCEL_NOT_ALLOWED`). Only admin may record
        the booking cancellation via `cancelBooking`. Other non-withdrawable states
        (`withdrawn`, `not_selected`, `rejected`, `expired`) use generic conflict errors.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/QuotationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Quotation withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SelfCancelOrConflict'

  /quotations/{quotationId}/accept:
    post:
      operationId: acceptQuotation
      tags: [Quotations, Bookings]
      summary: Accept a quotation and create a pending booking
      description: |
        Shipper owning the load accepts a `submitted` quotation. Server:
        1. Marks quotation `accepted` and sibling open quotations `not_selected`
           (QA-002 quote restore — user-approved 2026-11-07). `not_selected`
           quotes are recoverable if the pending booking fails before confirmation
           (see `POST /loads/{loadId}/quotations/restore-not-selected`).
        2. Creates a booking in status `pending_payment_arrangement`.
        3. Moves load to `booking_pending`.
        Booking is **not** confirmed by this call. Confirmation requires a confirmed payment
        arrangement via `/bookings/{bookingId}/confirm`.
        **Commission owing gate (user-approved 2026-11-09):** if the quotation's transporter
        company has unpaid commission outstanding, return **409**
        `CommissionOutstandingError` (same pinned schema as `createQuotation` and
        `confirmBooking`). Do not create the booking. The transporter may
        still view the load; settle owing before new work is accepted.
        **Off-platform ban gate (user-approved 2026-11-10):** if the calling user, the shipper company, or the quotation's
        transporter company (or the user who submitted the quotation) has an active
        off-platform ban (`startsAt <= now < endsAt`, not lifted), return **409**
        `AccountBannedError` (`code: ACCOUNT_BANNED`, required `details.bannedUntil`).
        Existing records stay visible. Checked before the commission-owing gate.
        Do not create the booking.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/QuotationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptQuotationRequest'
      responses:
        '201':
          description: Pending booking created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptQuotationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/NewWorkGateConflict'

  /bookings:
    get:
      operationId: listBookings
      tags: [Bookings]
      summary: List bookings for the caller
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/BookingStatus'
        - name: companyId
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
