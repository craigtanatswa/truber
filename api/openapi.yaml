          type: string
          maxLength: 1000

    AcceptQuotationResponse:
      type: object
      required: [quotation, booking]
      properties:
        quotation:
          $ref: '#/components/schemas/Quotation'
        booking:
          $ref: '#/components/schemas/Booking'

    BookingStatus:
      type: string
      enum:
        - pending_payment_arrangement
        - confirmed
        - cancelled
      description: |
        `pending_payment_arrangement` after quotation accept. `confirmed` only after
        server-confirmed payment arrangement (and escrow protection when required).

    TripStatus:
      type: string
      enum:
        - not_started
        - truck_dispatched
        - goods_collected
        - in_transit
        - delivered
      description: Operational progress. `delivered` is transporter assertion only.

    CompletionStatus:
      type: string
      enum:
        - not_complete
        - awaiting_shipper_acceptance
        - completed
        - disputed
        - cancelled
      description: |
        Trip completion is distinct from transporter `delivered` and from payment release
        (QA-003 provisional Charlie policy — not user-approved).
        On shipper delivery acceptance (with POD present), status becomes `completed`.
        Release remains a separate admin/ops recording step and must not redefine completion.
        `disputed` holds release until admin resolution (QA-005).
        `awaiting_release` was removed in v0.2.0 as unsafe conflation with completion.

    Booking:
      type: object
      required:
        - id
        - loadId
        - quotationId
        - shipperCompanyId
        - transporterCompanyId
        - status
        - tripStatus
        - completionStatus
        - agreedAmount
        - commissionRateBps
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        loadId:
          $ref: '#/components/schemas/Uuid'
        quotationId:
          $ref: '#/components/schemas/Uuid'
        shipperCompanyId:
          $ref: '#/components/schemas/Uuid'
        transporterCompanyId:
          $ref: '#/components/schemas/Uuid'
        truckId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/BookingStatus'
        tripStatus:
          $ref: '#/components/schemas/TripStatus'
        completionStatus:
          $ref: '#/components/schemas/CompletionStatus'
        agreedAmount:
          $ref: '#/components/schemas/PositiveMoneyAmount'
        commissionRateBps:
          type: integer
          description: Commission in basis points; MVP fixed at 500 (5.00%)
          enum: [500]
        confirmedPaymentArrangementId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          type: string
          nullable: true
          description: Set when booking becomes confirmed; references the confirming arrangement.
        confirmedAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          type: string
          nullable: true
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'

    BookingListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Booking'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    UpdateTripStatusRequest:
      type: object
      required: [tripStatus]
      properties:
        tripStatus:
          $ref: '#/components/schemas/TripStatus'
        note:
          type: string
          maxLength: 1000

    PaymentMethod:
      type: string
      enum:
        - prepay
        - escrow
        - deposit_balance
        - cash
        - corporate_credit
      description: |
        `cash` is never payment-protected. `escrow` requires independent-provider evidence
        for protection. Provider brand names are not claimed as integrated.

    ArrangementStatus:
      type: string
      enum: [proposed, confirmed, rejected, cancelled]
      description: Whether Truber has confirmed the payment plan for the booking.

    TransactionPaymentStatus:
      type: string
      enum: [unpaid, partially_paid, paid, refunded, failed]
      description: Status of recorded money movement for a transaction — not arrangement or protection.

    ProtectionStatus:
      type: string
      enum:
        - none
        - pending_evidence
        - protected
        - protection_failed
        - released_from_protection
      description: |
        Escrow/protected hold state. Always `none` for cash. `protected` requires
        server-accepted independent-provider evidence — never client self-assertion.

    ReleaseStatus:
      type: string
      enum:
        - not_applicable
        - held
        - release_requested
        - released_recorded
        - release_failed
      description: |
        Release tracking. `released_recorded` means an audit/ops record exists; it does
        not assert Truber moved funds.

    PaymentArrangement:
      type: object
      required:
        - id
        - bookingId
        - method
        - arrangementStatus
        - protectionStatus
        - releaseStatus
        - totalAmount
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        bookingId:
          $ref: '#/components/schemas/Uuid'
        method:
          $ref: '#/components/schemas/PaymentMethod'
        arrangementStatus:
          $ref: '#/components/schemas/ArrangementStatus'
        protectionStatus:
          $ref: '#/components/schemas/ProtectionStatus'
        releaseStatus:
          $ref: '#/components/schemas/ReleaseStatus'
        totalAmount:
          $ref: '#/components/schemas/PositiveMoneyAmount'
        depositAmount:
          allOf:
            - $ref: '#/components/schemas/MoneyAmount'
          type: object
          nullable: true
          description: Required when method is deposit_balance.
        balanceAmount:
          allOf:
            - $ref: '#/components/schemas/MoneyAmount'
          type: object
          nullable: true
          description: Required when method is deposit_balance.
        corporateCreditTermsDays:
          type: integer
          enum: [7, 14, 30]
          nullable: true
          description: Required when method is corporate_credit.
        providerHint:
          type: string
          nullable: true
          description: |
            Optional free-text hint (e.g. intended rail). Not a confirmed integration.
            Must not be treated as proof of Paynow/EcoCash/InnBucks support.
        protectionEvidence:
          allOf:
            - $ref: '#/components/schemas/ProtectionEvidence'
          type: object
          nullable: true
        depositReceipt:
          allOf:
            - $ref: '#/components/schemas/DepositReceipt'
          type: object
          nullable: true
          description: Required before confirming deposit_balance arrangements.
        confirmedAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          type: string
          nullable: true
        confirmedByUserId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          type: string
          nullable: true
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'

    ProtectionEvidence:
      type: object
      required: [providerName, externalReference, recordedAt, recordedByUserId]
      properties:
        providerName:
          type: string
          description: Independent provider name as recorded by ops (not an integration claim)
          maxLength: 200
        externalReference:
          type: string
          description: Provider reference / hold id / receipt id
          maxLength: 200
        notes:
          type: string
          maxLength: 2000
          nullable: true
        recordedAt:
          $ref: '#/components/schemas/DateTime'
        recordedByUserId:
          $ref: '#/components/schemas/Uuid'

    CreatePaymentArrangementRequest:
      type: object
      description: |
        Propose a payment plan. `totalAmount` must be strictly positive (QA-007).
        For `deposit_balance`: both `depositAmount` and `balanceAmount` required, each
        positive, and deposit+balance must equal total. Split ratio is **configurable**
        (50/50 is only an example — no fixed rate in the contract).
        For `corporate_credit`: `corporateCreditTermsDays` required; server rejects unless
        the shipper company has an **approved** credit account with sufficient available
        capacity (QA-011). Capacity reservation is concurrency-safe at confirm time.
      required: [method, totalAmount]
      properties:
        method:
          $ref: '#/components/schemas/PaymentMethod'
        totalAmount:
          $ref: '#/components/schemas/PositiveMoneyAmount'
        depositAmount:
          $ref: '#/components/schemas/PositiveMoneyAmount'
        balanceAmount:
          $ref: '#/components/schemas/PositiveMoneyAmount'
        corporateCreditTermsDays:
          type: integer
          enum: [7, 14, 30]
        providerHint:
          type: string
          maxLength: 200
        notes:
          type: string
          maxLength: 2000

    ConfirmPaymentArrangementRequest:
      type: object
      properties:
        notes:
          type: string
          maxLength: 2000
        protectionEvidence:
          allOf:
            - $ref: '#/components/schemas/ProtectionEvidenceRequest'
          description: Optional; admin may attach evidence in the same call for escrow.

    ProtectionEvidenceRequest:
      type: object
      required: [providerName, externalReference]
      properties:
        providerName:
          type: string
          minLength: 1
          maxLength: 200
        externalReference:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: string
          maxLength: 2000

    PaymentArrangementListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PaymentArrangement'

    PaymentTransaction:
      type: object
      required:
        - id
        - arrangementId
        - amount
        - paymentStatus
        - recordedAt
        - recordedByUserId
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        arrangementId:
          $ref: '#/components/schemas/Uuid'
        amount:
          $ref: '#/components/schemas/MoneyAmount'
        paymentStatus:
          $ref: '#/components/schemas/TransactionPaymentStatus'
        externalReference:
          type: string
          nullable: true
          maxLength: 200
        processingFee:
          allOf:
            - $ref: '#/components/schemas/MoneyAmount'
          type: object
          nullable: true
          description: Processing fee recorded separately from Truber commission.
        notes:
          type: string
          nullable: true
          maxLength: 2000
        recordedAt:
          $ref: '#/components/schemas/DateTime'
        recordedByUserId:
          $ref: '#/components/schemas/Uuid'

    RecordPaymentTransactionRequest:
      type: object
      required: [amount, paymentStatus]
      properties:
        amount:
          $ref: '#/components/schemas/PositiveMoneyAmount'
        paymentStatus:
          $ref: '#/components/schemas/TransactionPaymentStatus'
        externalReference:
          type: string
          maxLength: 200
        processingFee:
          $ref: '#/components/schemas/NonNegativeMoneyAmount'
        notes:
          type: string
          maxLength: 2000

    PaymentTransactionListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PaymentTransaction'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    ReleaseChannel:
      type: string
      enum: [manual_ops, provider_api]
      description: |
        `manual_ops` is the MVP path. `provider_api` flags a future capability for when
        an authorised provider exposes release automation — recording with this channel
        still does not claim funds moved via Truber.

    PaymentReleaseRecord:
      type: object
      required:
        - id
        - arrangementId
        - releaseChannel
        - releaseStatus
        - tripAmount
        - commissionAmount
        - transporterNetAmount
        - recordedAt
        - recordedByUserId
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        arrangementId:
          $ref: '#/components/schemas/Uuid'
        releaseChannel:
          $ref: '#/components/schemas/ReleaseChannel'
        releaseStatus:
          $ref: '#/components/schemas/ReleaseStatus'
        tripAmount:
          allOf:
            - $ref: '#/components/schemas/PositiveMoneyAmount'
          description: Completed trip amount used as commission base.
        commissionAmount:
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoneyAmount'
          description: 5% of tripAmount half-up to minor unit (provisional rounding).
        commissionRateBps:
          type: integer
          enum: [500]
        processingFeesTotal:
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoneyAmount'
          type: object
          nullable: true
          description: Sum of processing fees accounted separately from commission; zero allowed.
        transporterNetAmount:
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoneyAmount'
          description: |
            tripAmount minus commissionAmount before separately assigned processing fees
            (fee payer unresolved).
        externalReference:
          type: string
          nullable: true
          maxLength: 200
        notes:
          type: string
          nullable: true
          maxLength: 2000
        fundsMovementClaimedByTruber:
          type: boolean
          enum: [false]
          description: Always false. Release records are audit/ops only in this contract.
        recordedAt:
          $ref: '#/components/schemas/DateTime'
        recordedByUserId:
          $ref: '#/components/schemas/Uuid'

    RecordPaymentReleaseRequest:
      type: object
      description: |
        Admin/ops only. Server returns 409 unless booking `completionStatus=completed`
        (shipper accepted delivery with POD, or admin resolved dispute to completed with
        audit — QA-001/QA-005). Release is held while `disputed`. Manually recorded only;
        never claims Truber moved funds; no float; no live provider API.
        `tripAmount` must be positive; `processingFeesTotal` may be zero (QA-007).
      required: [releaseChannel, tripAmount]
      properties:
        releaseChannel:
          $ref: '#/components/schemas/ReleaseChannel'
        tripAmount:
          $ref: '#/components/schemas/PositiveMoneyAmount'
        processingFeesTotal:
          $ref: '#/components/schemas/NonNegativeMoneyAmount'
        externalReference:
          type: string
          maxLength: 200
        notes:
          type: string
          maxLength: 2000

    ProofOfDelivery:
      type: object
      required:
        - id
        - bookingId
        - uploadedByUserId
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        bookingId:
          $ref: '#/components/schemas/Uuid'
        deliveryNoteReference:
          type: string
          nullable: true
          maxLength: 200
        photoUris:
          type: array
          items:
            type: string
            format: uri
          maxItems: 20
        recipientName:
          type: string
          nullable: true
          maxLength: 200
        recipientConfirmationNote:
          type: string
          nullable: true
          maxLength: 2000
        uploadedByUserId:
          $ref: '#/components/schemas/Uuid'
        createdAt:
          $ref: '#/components/schemas/DateTime'

    CreateProofOfDeliveryRequest:
      type: object
      description: |
        QA-008 schema-enforced non-vacuous POD (not prose-only). Instance must satisfy
        `anyOf`: (A) nonempty `photoUris` with each entry a non-blank `uri`, or
        (B) non-blank `recipientConfirmationNote` (recipient confirmation). Both may be
        present. Optional supporting fields: `deliveryNoteReference`, `recipientName`.
        Empty `{}`, empty file lists, blank confirmation, and malformed/blank URIs are invalid.
      properties:
        deliveryNoteReference:
          type: string
          minLength: 1
          maxLength: 200
        photoUris:
          type: array
          description: File evidence URIs; emptiness alone does not satisfy anyOf.
          items:
            type: string
            format: uri
            minLength: 1
            description: Absolute http(s) URI for a POD file/photo
            pattern: '^https?://\S+$'
          maxItems: 20
        recipientName:
          type: string
          minLength: 1
          maxLength: 200
        recipientConfirmationNote:
          type: string
          maxLength: 2000
      anyOf:
        - type: object
          required: [photoUris]
          properties:
            photoUris:
              type: array
              minItems: 1
              maxItems: 20
              items:
                type: string
                format: uri
                minLength: 1
                description: Absolute http(s) URI for a POD file/photo
                pattern: '^https?://\S+$'
        - type: object
          required: [recipientConfirmationNote]
          properties:
            recipientConfirmationNote:
              type: string
              minLength: 1
              maxLength: 2000
              pattern: '^.*\S.*$'

    ProofOfDeliveryListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProofOfDelivery'

    DeliveryConfirmationDecision:
      type: string
      enum: [accepted, disputed]

    DeliveryConfirmation:
      type: object
      required: [bookingId, decision, confirmedByUserId, confirmedAt]
      properties:
        bookingId:
          $ref: '#/components/schemas/Uuid'
        decision:
          $ref: '#/components/schemas/DeliveryConfirmationDecision'
        notes:
          type: string
          nullable: true
          maxLength: 2000
        confirmedByUserId:
          $ref: '#/components/schemas/Uuid'
        confirmedAt:
          $ref: '#/components/schemas/DateTime'

    ConfirmDeliveryRequest:
      type: object
      description: |
        Shipper decision. Server rejects (409) if no POD artifact exists for the booking
        (QA-008). On `accepted`, `completionStatus` becomes `completed` (QA-003 provisional).
        On `disputed`, `completionStatus` becomes `disputed` and release is held (QA-005).
      required: [decision]
      properties:
        decision:
          $ref: '#/components/schemas/DeliveryConfirmationDecision'
        notes:
          type: string
          maxLength: 2000

    RatingDirection:
      type: string
      enum: [shipper_rates_transporter, transporter_rates_shipper]

    Rating:
      type: object
      required:
        - id
        - bookingId
        - direction
        - score
        - raterUserId
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        bookingId:
          $ref: '#/components/schemas/Uuid'
        direction:
          $ref: '#/components/schemas/RatingDirection'
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true
          maxLength: 2000
        raterUserId:
          $ref: '#/components/schemas/Uuid'
        createdAt:
          $ref: '#/components/schemas/DateTime'

    CreateRatingRequest:
      type: object
      required: [direction, score]
      properties:
        direction:
          $ref: '#/components/schemas/RatingDirection'
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 2000

    RatingListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Rating'

    ConfirmBookingRequest:
      type: object
      description: |
        Optional body. Admin override must include auditOverrideReason; shipper omit.
        Override never bypasses payment gates.
      properties:
        auditOverrideReason:
          type: string
          minLength: 8
          maxLength: 2000
          description: Required when an admin confirms on behalf of ops assistance.

    CancelBookingRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        beforeCollection:
          type: boolean
          default: true
          description: MVP path expects true; post-collection cancel policy unresolved.

    ResolveDisputeRequest:
      type: object
      required: [resolution, reason]
      properties:
        resolution:
          type: string
          enum: [complete_trip, cancel_trip]
        reason:
          type: string
          minLength: 1
          maxLength: 2000

    DisputeResolutionRecord:
      type: object
      required: [bookingId, resolution, reason, resolvedByUserId, resolvedAt, resultingCompletionStatus]
      properties:
        bookingId:
          $ref: '#/components/schemas/Uuid'
        resolution:
          type: string
          enum: [complete_trip, cancel_trip]
        reason:
          type: string
        resolvedByUserId:
          $ref: '#/components/schemas/Uuid'
        resolvedAt:
          $ref: '#/components/schemas/DateTime'
        resultingCompletionStatus:
          $ref: '#/components/schemas/CompletionStatus'

    DepositReceiptRequest:
      type: object
      required: [externalReference, amount]
      properties:
        externalReference:
          type: string
          minLength: 1
          maxLength: 200
        amount:
          $ref: '#/components/schemas/PositiveMoneyAmount'
        notes:
          type: string
          maxLength: 2000

    DepositReceipt:
      type: object
      required: [externalReference, amount, recordedAt, recordedByUserId]
      properties:
        externalReference:
          type: string
        amount:
          $ref: '#/components/schemas/PositiveMoneyAmount'
        notes:
          type: string
          nullable: true
        recordedAt:
          $ref: '#/components/schemas/DateTime'
        recordedByUserId:
          $ref: '#/components/schemas/Uuid'

    RecordRefundRequest:
      type: object
      required: [amount, reason]
      properties:
        amount:
          allOf:
            - $ref: '#/components/schemas/PositiveMoneyAmount'
          description: Magnitude of refund (audit); direction encoded on the record.
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        externalReference:
          type: string
          maxLength: 200

    PaymentRefundRecord:
      type: object
      required:
        - id
        - arrangementId
        - amount
        - reason
        - fundsMovementClaimedByTruber
        - recordedAt
        - recordedByUserId
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        arrangementId:
          $ref: '#/components/schemas/Uuid'
        amount:
          $ref: '#/components/schemas/PositiveMoneyAmount'
        reason:
          type: string
        externalReference:
          type: string
          nullable: true
        fundsMovementClaimedByTruber:
          type: boolean
          enum: [false]
        recordedAt:
          $ref: '#/components/schemas/DateTime'
        recordedByUserId:
          $ref: '#/components/schemas/Uuid'

    CreditAccountStatus:
      type: string
      enum: [unapproved, approved, suspended, revoked]

    CreditAccount:
      type: object
      required:
        - companyId
        - status
        - creditLimit
        - reservedAmount
        - availableAmount
        - updatedAt
      properties:
        companyId:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/CreditAccountStatus'
        creditLimit:
          $ref: '#/components/schemas/NonNegativeMoneyAmount'
        reservedAmount:
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoneyAmount'
          description: Sum of outstanding reservations (concurrency-safe)
        availableAmount:
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoneyAmount'
          description: creditLimit minus reservedAmount (and drawn, when modeled)
        defaultTermsDays:
          type: integer
          enum: [7, 14, 30]
          nullable: true
        updatedAt:
          $ref: '#/components/schemas/DateTime'

    UpsertCreditAccountRequest:
      type: object
      required: [status, creditLimit]
      properties:
        status:
          $ref: '#/components/schemas/CreditAccountStatus'
        creditLimit:
          $ref: '#/components/schemas/NonNegativeMoneyAmount'
        defaultTermsDays:
          type: integer
          enum: [7, 14, 30]
        notes:
          type: string
          maxLength: 2000

    OtpRequestResponse:
      type: object
      required: [status, expiresInSeconds]
      properties:
        status:
          type: string
          enum: [dispatched, stubbed]
        expiresInSeconds:
          type: integer
          minimum: 1

    VerifyOtpRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 4
          maxLength: 12

    VerificationDocumentType:
      type: string
      enum:
        - national_id
        - company_registration
        - tax_clearance
        - vehicle_registration
        - insurance
        - other

    VerificationDocumentStatus:
      type: string
      enum: [submitted, approved, rejected]

    VerificationDocument:
      type: object
      required:
        - id
        - ownerUserId
        - documentType
        - documentUri
        - status
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        ownerUserId:
          $ref: '#/components/schemas/Uuid'
        companyId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          type: string
          nullable: true
        truckId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          type: string
          nullable: true
        documentType:
          $ref: '#/components/schemas/VerificationDocumentType'
        documentUri:
          type: string
          format: uri
        status:
          $ref: '#/components/schemas/VerificationDocumentStatus'
        reviewNotes:
          type: string
          nullable: true
        createdAt:
          $ref: '#/components/schemas/DateTime'
        reviewedAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          type: string
          nullable: true

    CreateVerificationDocumentRequest:
      type: object
      required: [documentType, documentUri]
      properties:
        documentType:
          $ref: '#/components/schemas/VerificationDocumentType'
        documentUri:
          type: string
          format: uri
        companyId:
          $ref: '#/components/schemas/Uuid'
        truckId:
          $ref: '#/components/schemas/Uuid'

    ReviewVerificationDocumentRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        reviewNotes:
          type: string
          maxLength: 2000
        setCompanyVerified:
          type: boolean
          default: false
        setTruckVerified:
          type: boolean
          default: false

    VerificationDocumentListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/VerificationDocument'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

