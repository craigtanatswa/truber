  /bookings/{bookingId}/confirm:
    post:
      operationId: confirmBooking
      tags: [Bookings]
      summary: Confirm booking after payment arrangement is server-confirmed
      description: |
        Transitions booking from `pending_payment_arrangement` to `confirmed` **only if**
        there exists a payment arrangement for this booking with `arrangementStatus=confirmed`
        and method-specific protection rules satisfied. **Payment gate is absolute.**

        **Actor authority (fixes unsafe v0.1.0 ambiguity):**
        - Primary actor: shipper company member on the booking.
        - Admin may call with `auditOverride` reason in the body for operational assistance,
          but admin **never bypasses** the arrangement-confirmed / escrow-protected gates
          (provisional Charlie policy §3 — not user-approved). Override creates an audit record.

        Method rules:
        - `cash`: arrangement confirmed; `protectionStatus` stays `none`.
        - `prepay`: arrangement confirmed; deposit receipt N/A.
        - `deposit_balance`: arrangement confirmed only after deposit **receipt** recorded
          (provisional §4); split amounts configurable (no fixed 50/50).
        - `corporate_credit`: arrangement confirmed only if credit account approved and
          atomic capacity reservation succeeds (QA-011 / provisional §4).
        - `escrow`: arrangement confirmed **and** `protectionStatus=protected` with
          independent-provider evidence (admin/ops recorded — not client claim).

        Clients cannot set payment/protection flags. Race-safe via Idempotency-Key.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmBookingRequest'
      responses:
        '200':
          description: Booking confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Missing confirmed arrangement, escrow not protected, or invalid state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /bookings/{bookingId}/payment-arrangements:
    get:
      operationId: listPaymentArrangements
      tags: [Payments]
