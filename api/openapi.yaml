    ProtectionEvidence:
      type: object
      required: [providerName, externalReference, recordedAt, recordedByUserId]
      properties:
        providerName:
          type: string
          description: Independent provider name as recorded by ops (not an integration claim)
          maxLength: 200
        externalReference:
          type: string
          description: Provider reference / hold id / receipt id
          maxLength: 200
        notes:
          type: string
          maxLength: 2000
          nullable: true
        recordedAt:
          $ref: '#/components/schemas/DateTime'
        recordedByUserId:
          $ref: '#/components/schemas/Uuid'

    CreatePaymentArrangementRequest:
      type: object
      description: |
        Propose a payment plan. `totalAmount` must be strictly positive (QA-007).
        For `deposit_balance`: both `depositAmount` and `balanceAmount` required, each
        positive, and deposit+balance must equal total. Split ratio is **configurable**
        (50/50 is only an example — no fixed rate in the contract).
        For `corporate_credit`: `corporateCreditTermsDays` required; server rejects unless
        the shipper company has an **approved** credit account with sufficient available
        capacity (QA-011). Capacity reservation is concurrency-safe at confirm time.
      required: [method, totalAmount]
      properties:
        method:
          $ref: '#/components/schemas/PaymentMethod'
        totalAmount:
          $ref: '#/components/schemas/PositiveMoneyAmount'
        depositAmount:
          $ref: '#/components/schemas/PositiveMoneyAmount'
        balanceAmount:
          $ref: '#/components/schemas/PositiveMoneyAmount'
        corporateCreditTermsDays:
          type: integer
          enum: [7, 14, 30]
        providerHint:
          type: string
          maxLength: 200
        notes:
          type: string
          maxLength: 2000

    ConfirmPaymentArrangementRequest:
      type: object
      properties:
        notes:
          type: string
          maxLength: 2000
        protectionEvidence:
          allOf:
            - $ref: '#/components/schemas/ProtectionEvidenceRequest'
          description: Optional; admin may attach evidence in the same call for escrow.

    ProtectionEvidenceRequest:
      type: object
      required: [providerName, externalReference]
      properties:
        providerName:
          type: string
          minLength: 1
          maxLength: 200
        externalReference:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: string
          maxLength: 2000

    PaymentArrangementListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PaymentArrangement'

    PaymentTransaction:
      type: object
      required:
        - id
        - arrangementId
        - amount
        - paymentStatus
        - recordedAt
        - recordedByUserId
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        arrangementId:
          $ref: '#/components/schemas/Uuid'
        amount:
          $ref: '#/components/schemas/MoneyAmount'
        paymentStatus:
          $ref: '#/components/schemas/TransactionPaymentStatus'
        externalReference:
          type: string
          nullable: true
          maxLength: 200
        processingFee:
          allOf:
            - $ref: '#/components/schemas/MoneyAmount'
          type: object
          nullable: true
          description: |
            Processing fee recorded separately from Truber commission; deducted from the
            transporter payout. Returned only to transporter-company members and admins.
            Shipper-side callers always receive null (user decision 2026-11-11: shippers do
            not see the payout breakdown).
        notes:
          type: string
          nullable: true
          maxLength: 2000
        recordedAt:
          $ref: '#/components/schemas/DateTime'
        recordedByUserId:
          $ref: '#/components/schemas/Uuid'

    RecordPaymentTransactionRequest:
      type: object
      required: [amount, paymentStatus]
      properties:
        amount:
          $ref: '#/components/schemas/PositiveMoneyAmount'
        paymentStatus:
          $ref: '#/components/schemas/TransactionPaymentStatus'
        externalReference:
          type: string
          maxLength: 200
        processingFee:
          $ref: '#/components/schemas/NonNegativeMoneyAmount'
        notes:
          type: string
          maxLength: 2000

    PaymentTransactionListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PaymentTransaction'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    ReleaseChannel:
      type: string
      enum: [manual_ops, provider_api]
      description: |
        `manual_ops` is the MVP path. `provider_api` flags a future capability for when
        an authorised provider exposes release automation — recording with this channel
        still does not claim funds moved via Truber.

    PaymentReleaseRecord:
      type: object
      required:
        - id
        - arrangementId
        - releaseChannel
        - releaseStatus
        - tripAmount
        - commissionAmount
        - commissionRateBps
        - transporterNetAmount
        - recordedAt
        - recordedByUserId
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        arrangementId:
          $ref: '#/components/schemas/Uuid'
        releaseChannel:
          $ref: '#/components/schemas/ReleaseChannel'
        releaseStatus:
          $ref: '#/components/schemas/ReleaseStatus'
        tripAmount:
          allOf:
            - $ref: '#/components/schemas/PositiveMoneyAmount'
          description: |
            Copy of `Booking.agreedAmount` (the canonical agreed price), fixed when the record
            is written after completion. Never an independently typed figure (v0.5.0).
        commissionAmount:
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoneyAmount'
          description: 5% of tripAmount, half-up to the minor unit (approved rounding).
        commissionRateBps:
          type: integer
          enum: [500]
          description: |
            Rate applied on this record. **Required and immutable** (v0.5.0) so historical
            records keep their rate if the commission rate ever changes.
        processingFeesTotal:
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoneyAmount'
          type: object
          nullable: true
          description: Sum of processing fees accounted separately from commission; zero allowed.
        transporterNetAmount:
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoneyAmount'
          description: |
            Server-computed: tripAmount − commissionAmount − processingFeesTotal,
            integer minor units, same currency. Shipper pays the agreed trip amount;
            commission and recorded processing fees are deducted from the transporter
            (user-approved 2026-11-09). For cash, do not book a fare payout due.
            For `deposit_balance`, do not treat an unreceipted balance remainder as payable.
        externalReference:
          type: string
          nullable: true
          maxLength: 200
        notes:
          type: string
          nullable: true
          maxLength: 2000
        fundsMovementClaimedByTruber:
          type: boolean
          enum: [false]
          description: Always false. Release records are audit/ops only in this contract.
        recordedAt:
          $ref: '#/components/schemas/DateTime'
        recordedByUserId:
          $ref: '#/components/schemas/Uuid'

    RecordPaymentReleaseRequest:
      type: object
      description: |
        Admin/ops only. Server returns 409 unless booking `completionStatus=completed`
        (shipper accepted delivery with POD, or admin resolved dispute to completed with
        audit — QA-001/QA-005). Release is held while `disputed`. Manually recorded only;
        never claims Truber moved funds; no float; no live provider API.
        `tripAmount` is optional (v0.5.0): the server uses `Booking.agreedAmount`;
        if `tripAmount` is sent it must equal that amount exactly, else 409
        `TRIP_AMOUNT_MISMATCH`. `processingFeesTotal` may be zero (QA-007).
        Server computes `commissionAmount` (half-up 5%). `processingFeesTotal`, if supplied,
        must match the sum of recorded transaction processing fees in the same currency
        (409 if it does not). Mixed currency rejected. 409 if commission + fees would
        make net negative. Corporate-credit payout stays blocked until the shipper
        payment is recorded. For cash, no fare payout due is created and commission
        owing is not settled by this call. For `deposit_balance`, an unreceipted
        balance remainder is not payable (no float / no lending).
      required: [releaseChannel]
      properties:
        releaseChannel:
          $ref: '#/components/schemas/ReleaseChannel'
        tripAmount:
          $ref: '#/components/schemas/PositiveMoneyAmount'
        processingFeesTotal:
          $ref: '#/components/schemas/NonNegativeMoneyAmount'
        externalReference:
          type: string
          maxLength: 200
        notes:
          type: string
          maxLength: 2000

    PayoutFeeType:
      type: string
      enum: [processing_fee]
      description: |
        v0.5.0. Fee kinds deducted from the transporter payout. Only processing fees
        recorded on payment transactions exist today; Truber charges no fee besides the
        commission.

    RecordedFee:
      type: object
      description: v0.5.0. One recorded fee, taken from a payment transaction.
      required: [feeType, amount, transactionId]
      properties:
        feeType:
          $ref: '#/components/schemas/PayoutFeeType'
        amount:
          $ref: '#/components/schemas/NonNegativeMoneyAmount'
        transactionId:
          $ref: '#/components/schemas/Uuid'

    UnknownFee:
      type: object
      description: |
        v0.5.0. A fee that may still be deducted but has no confirmed figure. No amount
        is given on purpose; the client must not show it as 0.
      required: [feeType, reason]
      properties:
        feeType:
          $ref: '#/components/schemas/PayoutFeeType'
        reason:
          type: string
          enum: [provider_not_contracted, payment_rail_not_selected]
          description: |
            `provider_not_contracted`: no Truber contract fixes the provider fee.
            `payment_rail_not_selected`: the payment method/rail is not chosen yet.

    PayoutBlockedReason:
      type: string
      enum:
        - no_confirmed_arrangement
        - trip_not_completed
        - disputed
        - cash_fare_not_held
        - shipper_payment_not_recorded
        - balance_not_receipted
        - shipper_funds_not_received
        - protection_evidence_missing
        - already_released
        - net_payout_negative
      description: |
        v0.5.0. Why a transporter payout is not payable now. `cash_fare_not_held`:
        Truber never held the fare. `shipper_payment_not_recorded`: corporate credit before
        the shipper pays. `balance_not_receipted`: deposit_balance remainder not receipted.
        `shipper_funds_not_received`: prepay/escrow funds not recorded. `net_payout_negative`:
        commission plus recorded fees exceed the agreed amount (the read-side form of the
        write-side 409 `NET_PAYOUT_NEGATIVE`). Truber never lends.

    BookingPayoutBreakdown:
      type: object
      description: v0.5.0. Server-computed payout split for one booking. Records only.
      required:
        - bookingId
        - transporterCompanyId
        - agreedAmount
        - commissionRateBps
        - commissionAmount
        - fees
        - feesTotal
        - netPayout
        - paymentMethod
        - paymentProtected
        - farePayoutDueThroughTruber
        - releaseStatus
        - payoutBlockedReasons
        - fundsMovementClaimedByTruber
        - computedAt
      properties:
        bookingId:
          $ref: '#/components/schemas/Uuid'
        transporterCompanyId:
          $ref: '#/components/schemas/Uuid'
        agreedAmount:
          allOf:
            - $ref: '#/components/schemas/PositiveMoneyAmount'
          description: Equals `Booking.agreedAmount`, the canonical amount the shipper pays in full.
        adjustedAgreedAmount:
          type: object
          nullable: true
          required: [amountMinor, currency]
          properties:
            amountMinor:
              type: integer
              minimum: 0
            currency:
              $ref: '#/components/schemas/CurrencyCode'
          description: |
            v0.5.0. Copy of `Booking.adjustedAgreedAmount`; null when never adjusted. When
            set, `commissionAmount` and `netPayout` are computed on this amount, not on
            `agreedAmount`.
        commissionRateBps:
          type: integer
          enum: [500]
        commissionAmount:
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoneyAmount'
          description: Half-up 5% of `agreedAmount`, server-computed.
        commissionStatus:
          type: string
          nullable: true
          enum: [open, held, settled_on_release, collected, voided, cancelled, null]
          description: |
            Status of the recognised receivable; null before trip completion. Same values as
            `CommissionReceivableStatus`, inlined (not `allOf` + `nullable`) so null validates
            under strict OpenAPI 3.0.3 tooling.
        fees:
          type: array
          description: Recorded fees only, same currency as `agreedAmount`. Empty when none recorded.
          items:
            $ref: '#/components/schemas/RecordedFee'
        feesTotal:
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoneyAmount'
          description: Sum of `fees`. 0 means no fee has been recorded, not that none will apply.
        netPayout:
          type: object
          nullable: true
          required: [amountMinor, currency]
          properties:
            amountMinor:
              type: integer
              minimum: 0
            currency:
              $ref: '#/components/schemas/CurrencyCode'
          description: |
            `agreedAmount − commissionAmount − feesTotal`. Null for cash (no fare payout through
            Truber) and when the result would be negative (`payoutBlockedReasons` then contains
            `net_payout_negative`). Never negative. Same shape as `NonNegativeMoneyAmount`,
            inlined (not `allOf` + `nullable`) so null validates under strict OpenAPI 3.0.3 tooling.
        paymentMethod:
          type: string
          nullable: true
          enum: [prepay, escrow, deposit_balance, cash, corporate_credit, null]
          description: |
            Method of the confirmed arrangement; null when none is confirmed. Same values as
            `PaymentMethod`, inlined so null validates under strict OpenAPI 3.0.3 tooling.
        paymentArrangementId:
          type: string
          format: uuid
          nullable: true
          description: Confirmed arrangement id; null when none is confirmed.
        paymentProtected:
          type: boolean
          description: |
            True only when the confirmed arrangement has `protectionStatus=protected`.
            Always false for cash.
        farePayoutDueThroughTruber:
          type: boolean
          description: False for cash and when no arrangement is confirmed.
        releaseStatus:
          $ref: '#/components/schemas/ReleaseStatus'
        payoutBlockedReasons:
          type: array
          description: Empty only when a release may be recorded now.
          items:
            $ref: '#/components/schemas/PayoutBlockedReason'
        fundsMovementClaimedByTruber:
          type: boolean
          enum: [false]
        computedAt:
          $ref: '#/components/schemas/DateTime'

    SubmissionBlockerAccountBanned:
      type: object
      additionalProperties: false
      description: |
        v0.5.0. Preview-side warning that an active off-platform ban blocks new work.
        Same code as the pinned `AccountBannedError` returned by `createQuotation`. Deliberately
        omits `message` and `details.bannedParty`: only bans on the calling user or the
        request's `transporterCompanyId` are considered, never a counterparty's ban.
      required: [code, details]
      properties:
        code:
          type: string
          enum: [ACCOUNT_BANNED]
        details:
          type: object
          additionalProperties: false
          required: [bannedUntil]
          properties:
            bannedUntil:
              allOf:
                - $ref: '#/components/schemas/DateTime'
              description: |
                Latest `endsAt` among the active bans on the calling user or the request's
                `transporterCompanyId`.

    SubmissionBlockerCommissionOutstanding:
      type: object
      additionalProperties: false
      description: |
        v0.5.0. Preview-side warning that unpaid commission blocks new work. Same code
        and same `details` schema (`CommissionOutstandingDetails`) as the pinned 409
        `CommissionOutstandingError` returned by `createQuotation`, so one parser reads both.
        No `message`. Computed only for the request's `transporterCompanyId`. Not
        currency-scoped: any currency owed blocks.
      required: [code, details]
      properties:
        code:
          type: string
          enum: [COMMISSION_OUTSTANDING]
        details:
          $ref: '#/components/schemas/CommissionOutstandingDetails'

    PayoutPreviewRequest:
      type: object
      additionalProperties: false
      required: [transporterCompanyId, amount]
      properties:
        transporterCompanyId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: |
            Required, as on `CreateQuotationRequest`. The transporter company the quote would be
            submitted for. The caller must be a member (admin may name any transporter company;
            there is no default). `submissionBlockers` are computed for this company only.
        amount:
          allOf:
            - $ref: '#/components/schemas/PositiveMoneyAmount'
          description: Proposed quote amount (what the shipper would pay in full).
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        loadId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Optional. When given, `amount.currency` must equal the load currency (400 otherwise).

    PayoutPreview:
      type: object
      description: v0.5.0. Server-computed, nothing stored.
      required:
        - agreedAmount
        - commissionRateBps
        - commissionAmount
        - knownFees
        - knownFeesTotal
        - netPayoutBeforeUnknownFees
        - feeStatus
        - unknownFees
        - farePayoutDueThroughTruber
        - paymentProtectedPossible
        - submissionBlockers
      properties:
        agreedAmount:
          $ref: '#/components/schemas/PositiveMoneyAmount'
        commissionRateBps:
          type: integer
          enum: [500]
        commissionAmount:
          $ref: '#/components/schemas/NonNegativeMoneyAmount'
        knownFees:
          type: array
          description: Fees with a confirmed figure. Empty in v0.5.0 (no contracted provider fee).
          items:
            type: object
            required: [feeType, amount]
            properties:
              feeType:
                $ref: '#/components/schemas/PayoutFeeType'
              amount:
                $ref: '#/components/schemas/NonNegativeMoneyAmount'
        knownFeesTotal:
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoneyAmount'
          description: Sum of `knownFees` only. Not a claim that total fees are this amount.
        netPayoutBeforeUnknownFees:
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoneyAmount'
          description: |
            `agreedAmount − commissionAmount − knownFeesTotal`. The final net can be lower by
            the fees in `unknownFees`.
        feeStatus:
          type: string
          enum: [unknown, known, not_applicable]
          description: |
            `unknown`: at least one fee may apply with no confirmed figure (see `unknownFees`).
            `known`: every applicable fee is in `knownFees`.
            `not_applicable`: cash; Truber processes no payment, so no processing fee is
            deducted through Truber.
        unknownFees:
          type: array
          description: Non-empty exactly when `feeStatus` is `unknown`.
          items:
            $ref: '#/components/schemas/UnknownFee'
        paymentMethod:
          type: string
          nullable: true
          enum: [prepay, escrow, deposit_balance, cash, corporate_credit, null]
          description: |
            Echo of the request `paymentMethod`; null when none was given. Same values as
            `PaymentMethod`, inlined so null validates under strict OpenAPI 3.0.3 tooling.
        farePayoutDueThroughTruber:
          type: boolean
          description: False for cash (Truber never holds the fare).
        paymentProtectedPossible:
          type: boolean
          description: False for cash (never protected). True otherwise; actual protection needs provider evidence.
        submissionBlockers:
          type: array
          description: |
            Why `createQuotation` would be refused right now for the request's
            `transporterCompanyId` (and the calling user). Computed for that one company
            only; another company's bans or receivables never appear. Empty when nothing
            blocks. Informational only; the server re-checks on submission. When both apply,
            `ACCOUNT_BANNED` is listed first (same order as the 409 gates). Each item matches
            exactly one branch, selected by `code` (discriminator).
          items:
            oneOf:
              - $ref: '#/components/schemas/SubmissionBlockerAccountBanned'
              - $ref: '#/components/schemas/SubmissionBlockerCommissionOutstanding'
            discriminator:
              propertyName: code
              mapping:
                ACCOUNT_BANNED: '#/components/schemas/SubmissionBlockerAccountBanned'
                COMMISSION_OUTSTANDING: '#/components/schemas/SubmissionBlockerCommissionOutstanding'

    ProofOfDelivery:
      type: object
      required:
        - id
        - bookingId
        - uploadedByUserId
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        bookingId:
          $ref: '#/components/schemas/Uuid'
        deliveryNoteReference:
          type: string
          nullable: true
          maxLength: 200
        photoUris:
          type: array
          items:
            type: string
            format: uri
          maxItems: 20
        recipientName:
          type: string
          nullable: true
          maxLength: 200
        recipientConfirmationNote:
          type: string
          nullable: true
          maxLength: 2000
        uploadedByUserId:
          $ref: '#/components/schemas/Uuid'
        createdAt:
          $ref: '#/components/schemas/DateTime'

    CreateProofOfDeliveryRequest:
      type: object
      description: |
        QA-008 schema-enforced non-vacuous POD (not prose-only). Instance must satisfy
        `anyOf`: (A) nonempty `photoUris` with each entry a non-blank `uri`, or
        (B) non-blank `recipientConfirmationNote` (recipient confirmation). Both may be
        present. Optional supporting fields: `deliveryNoteReference`, `recipientName`.
        Empty `{}`, empty file lists, blank confirmation, and malformed/blank URIs are invalid.
      properties:
        deliveryNoteReference:
          type: string
          minLength: 1
          maxLength: 200
        photoUris:
          type: array
          description: File evidence URIs; emptiness alone does not satisfy anyOf.
          items:
            type: string
            format: uri
            minLength: 1
            description: Absolute http(s) URI for a POD file/photo
            pattern: '^https?://\S+$'
          maxItems: 20
        recipientName:
          type: string
          minLength: 1
          maxLength: 200
        recipientConfirmationNote:
          type: string
          maxLength: 2000
      anyOf:
        - type: object
          required: [photoUris]
          properties:
            photoUris:
              type: array
              minItems: 1
              maxItems: 20
              items:
                type: string
                format: uri
                minLength: 1
                description: Absolute http(s) URI for a POD file/photo
                pattern: '^https?://\S+$'
        - type: object
          required: [recipientConfirmationNote]
          properties:
            recipientConfirmationNote:
              type: string
              minLength: 1
              maxLength: 2000
              pattern: '^.*\S.*$'

    ProofOfDeliveryListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProofOfDelivery'

    DeliveryConfirmationDecision:
      type: string
      enum: [accepted, disputed]

    DeliveryConfirmation:
      type: object
      required: [bookingId, decision, confirmedByUserId, confirmedAt]
      properties:
        bookingId:
          $ref: '#/components/schemas/Uuid'
        decision:
          $ref: '#/components/schemas/DeliveryConfirmationDecision'
        notes:
          type: string
          nullable: true
          maxLength: 2000
        confirmedByUserId:
          $ref: '#/components/schemas/Uuid'
        confirmedAt:
          $ref: '#/components/schemas/DateTime'

    ConfirmDeliveryRequest:
      type: object
      description: |
        Shipper decision. Server rejects (409) if no POD artifact exists for the booking
        (QA-008). On `accepted`, `completionStatus` becomes `completed` and the 24-hour
        dispute window opens (user decision 2026-11-11). On `disputed`, `completionStatus`
        becomes `disputed` and release is held (QA-005).
      required: [decision]
      properties:
        decision:
          $ref: '#/components/schemas/DeliveryConfirmationDecision'
        notes:
          type: string
          maxLength: 2000

    RatingDirection:
      type: string
      enum: [shipper_rates_transporter, transporter_rates_shipper]

    Rating:
      type: object
      required:
        - id
        - bookingId
        - direction
        - score
        - raterUserId
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        bookingId:
          $ref: '#/components/schemas/Uuid'
        direction:
          $ref: '#/components/schemas/RatingDirection'
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true
          maxLength: 2000
        raterUserId:
          $ref: '#/components/schemas/Uuid'
        createdAt:
          $ref: '#/components/schemas/DateTime'

    CreateRatingRequest:
      type: object
      required: [direction, score]
      properties:
        direction:
          $ref: '#/components/schemas/RatingDirection'
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 2000

    RatingListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Rating'

    ConfirmBookingRequest:
      type: object
      description: |
        Optional body. Admin override must include auditOverrideReason; shipper omit.
        Override never bypasses payment gates, the commission-owing gate, or an active
        off-platform ban (user-approved 2026-11-10).
      properties:
        auditOverrideReason:
          type: string
          minLength: 8
          maxLength: 2000
          description: Required when an admin confirms on behalf of ops assistance.

    CancelBookingRequest:
      type: object
      description: |
        Admin-only. `reason` is stored on the cancellation audit record
        (user-approved 2026-11-10: only admin records booking cancellation after a
        quotation is accepted, with an audited reason).
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        beforeCollection:
          type: boolean
          default: true
          description: |
            `true` if cancelled before collection; `false` if cancelled after collection.
            Post-collection admin-recorded cancellation is user-approved 2026-11-07.

    ResolveDisputeRequest:
      type: object
      description: |
        `adjustedAgreedAmount` is required for `adjust_amount` and rejected (400) otherwise.
      required: [resolution, reason]
      properties:
        resolution:
          type: string
          enum: [complete_trip, adjust_amount, cancel_trip]
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        adjustedAgreedAmount:
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoneyAmount'
          description: v0.5.0. New effective agreed amount for `adjust_amount`; `0` reverses.

    DisputeResolutionRecord:
      type: object
      required: [bookingId, resolution, reason, resolvedByUserId, resolvedAt, resultingCompletionStatus]
      properties:
        bookingId:
          $ref: '#/components/schemas/Uuid'
        resolution:
          type: string
          enum: [complete_trip, adjust_amount, cancel_trip]
        reason:
          type: string
        adjustmentId:
          type: string
          format: uuid
          nullable: true
          description: v0.5.0. The `CommissionAdjustment` recorded for `adjust_amount`; otherwise null.
        disputeId:
          type: string
          format: uuid
          nullable: true
          description: v0.5.0. The `BookingDispute` this resolution closed.
        resolvedByUserId:
          $ref: '#/components/schemas/Uuid'
        resolvedAt:
          $ref: '#/components/schemas/DateTime'
        resultingCompletionStatus:
          $ref: '#/components/schemas/CompletionStatus'

    DepositReceiptRequest:
      type: object
      required: [externalReference, amount]
      properties:
        externalReference:
          type: string
