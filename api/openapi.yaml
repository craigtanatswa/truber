      tags: [Admin, DeliveryConfirmation]
      summary: Admin resolve delivery dispute with audit (QA-005)
      description: |
        When `completionStatus=disputed`, admin resolves to `completed` or `cancelled`.
        Resolution is audited. Completing unlocks release recording eligibility; cancelling
        keeps release blocked. Does not move funds.
        If resolved to `completed` and no commission receivable exists yet for the booking,
        the server creates the same open 5% receivable as `confirmDelivery` accepted.
        If resolved to `cancelled`, no commission is recognised; any open receivable for
        this booking is `voided`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
