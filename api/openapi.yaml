  /bookings/{bookingId}/delivery-confirmation:
    get:
      operationId: getDeliveryConfirmation
      tags: [DeliveryConfirmation]
      summary: Get shipper delivery confirmation state
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Confirmation state (may be null body fields if not yet confirmed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryConfirmation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: confirmDelivery
      tags: [DeliveryConfirmation]
      summary: Shipper confirms delivery acceptance
      description: |
        Shipper delivery acceptance/dispute (QA-008/QA-003/QA-005). Distinct from transporter
        POD and from `tripStatus=delivered`.

        **Preconditions:** at least one POD artifact must exist for the booking (409 otherwise).
        On `accepted`: `completionStatus` → `completed` (user decision 2026-11-11: the
        shipper's acceptance from the POD completes the trip; completion is separate from
        release). The server sets `Booking.deliveryConfirmedAt` and
        `Booking.disputeWindowEndsAt = deliveryConfirmedAt + 24 hours`. Does not move funds and does
        not record release.
        **Commission recognition (user-approved 2026-11-09):** the server creates an open
        commission receivable for the transporter company, amount = half-up 5% of
        `booking.agreedAmount` (minor units, same currency). Recognition is at completion,
        not at release. For `cash`, the receivable remains a collect-later owing; no fare
        payout due is booked.
        **Dispute window (user decision 2026-11-11):** the shipper may open a dispute with
        `raiseBookingDispute` until `disputeWindowEndsAt`. If none is raised, the trip
        locks at `disputeWindowEndsAt` (`completionStatus=locked`, `lockedAt`) and the 5%
        commission is final. Until lock an admin may still cancel (`cancelBooking`), which
        voids the receivable; after lock only adjustments are possible
        (`recordBookingAdjustment`).
        On `disputed`: `completionStatus` → `disputed` and a `BookingDispute` opens (stage
        `at_delivery_confirmation`, `notes` as its reason) with the same 48-hour transporter
        response, settlement and admin-resolution flow as `raiseBookingDispute`. Release
        endpoints return 409 until the dispute is settled or resolved.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmDeliveryRequest'
      responses:
        '200':
          description: Delivery confirmation recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryConfirmation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
