    CommissionReceivableStatus:
      type: string
      enum: [open, held, settled_on_release, collected, voided, cancelled]
      description: |
        `open`: recognised at completion, not yet fully paid. Counts toward
        `outstandingByCurrency` and the owing gate.
        `held` (v0.5.0): a dispute is open on the trip. Not final (`finalAt` null). Excluded
        from `outstandingByCurrency`, the owing gate, collections and credit netting; shown
        in `CommissionAccount.heldByCurrency`. Leaves `held` when the dispute is settled or
        resolved (to `open`, `collected` or `cancelled`).
        `settled_on_release`: commission deducted from held trip funds on a release record
        (not used for cash fare payouts).
        `collected`: fully paid by recorded collections and/or applied credit.
        `voided`: the trip was cancelled **before lock** with no open dispute (admin
        `cancelBooking` before `disputeWindowEndsAt`). Any part already paid becomes
        commission credit (user decision 2026-11-11), never refunded in cash.
        `cancelled` (v0.5.0): an adjustment brought `effectiveAmount` to 0 with nothing
        left owing. After lock there are no voids, only adjustments.

    CommissionReceivable:
      type: object
      required:
        - id
        - bookingId
        - transporterCompanyId
        - amount
        - collectedAmount
        - remainingAmount
        - commissionRateBps
        - status
        - recognisedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        bookingId:
          $ref: '#/components/schemas/Uuid'
        transporterCompanyId:
          $ref: '#/components/schemas/Uuid'
        amount:
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoneyAmount'
          description: Original recognised 5% of the booking agreed amount, half-up to minor unit. Immutable.
        reducedAmount:
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoneyAmount'
          description: |
            v0.5.0. Total commission removed by `CommissionAdjustment` entries on this
            receivable (sum of `previousCommission − newCommission`). Starts at zero.
        effectiveAmount:
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoneyAmount'
          description: |
            v0.5.0. Commission after adjustments: `amount − reducedAmount` (= half-up 5% of the
            latest `newTripAmount`). Equals `amount` when never adjusted.
        creditAppliedAmount:
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoneyAmount'
          description: |
            v0.5.0. Commission credit from the company's balance used to pay this receivable.
            Starts at zero.
        disputeWindowEndsAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: v0.5.0. `recognisedAt` + 24 hours (copy of `Booking.disputeWindowEndsAt`).
        finalAt:
          type: string
          format: date-time
          nullable: true
          description: |
            v0.5.0. When the commission became final: `disputeWindowEndsAt` if no dispute was
            opened, otherwise the time the dispute was settled or resolved. Null while `held`
            or before the window ends.
        disputeRef:
          type: string
          format: uuid
          nullable: true
          description: v0.5.0. The open `BookingDispute` while `held`; otherwise null.
        heldSince:
          type: string
          format: date-time
          nullable: true
          description: v0.5.0. When the receivable entered `held`; null when not held.
        commissionRateBps:
          type: integer
          enum: [500]
          description: |
            Rate applied at recognition (v0.5.0). **Required and immutable**, so the
            receivable keeps its rate if the commission rate ever changes.
        collectedAmount:
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoneyAmount'
          description: |
            Sum of `recordCommissionCollection` amounts applied to this receivable
            (oldest-first). Starts at zero. Does not include amounts settled on release.
        remainingAmount:
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoneyAmount'
          description: |
            Unpaid remainder on this receivable, visible after partial collections.
            For `open` and `held`: remainingAmount + collectedAmount + creditAppliedAmount
            = effectiveAmount, unless paid amounts exceeded `effectiveAmount` after an
            adjustment, in which case remainingAmount is 0 and the excess was credited
            (`CommissionAdjustment.creditedAmount`). v0.5.0.
            For `collected`: remainingAmount is 0 and collectedAmount + creditAppliedAmount
            covers `effectiveAmount`.
            For `settled_on_release`: remainingAmount is 0; any previously collected
            amount stays in collectedAmount; the rest was settled by the release.
            For `voided` / `cancelled`: remainingAmount is 0; collectedAmount is left as
            already recorded and any paid part became commission credit.
        status:
          $ref: '#/components/schemas/CommissionReceivableStatus'
        recognisedAt:
          $ref: '#/components/schemas/DateTime'
          description: Timestamp when the trip became completed.
        settledAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          type: string
          nullable: true
        paymentMethod:
          allOf:
            - $ref: '#/components/schemas/PaymentMethod'
          type: string
          nullable: true

    CommissionAccount:
      type: object
      description: |
        Transporter commission balances (records only). `outstandingByCurrency` is open
        owing and is what the commission gate checks. `heldByCurrency` (dispute open) is
        **excluded from `outstandingByCurrency` and from the commission gate**: held
        commission does not block work (user decision 2026-11-11). `creditByCurrency` is
        commission credit; credit is applied to future commission and, where server policy allows, to outstanding commission. Credit is never paid out in cash.
      required: [companyId, outstandingByCurrency, heldByCurrency, creditByCurrency, receivables]
      properties:
        companyId:
          $ref: '#/components/schemas/Uuid'
        outstandingByCurrency:
          type: array
          description: |
            One entry per currency with unpaid owing. Each amount is the sum of
            `remainingAmount` on `open` receivables in that currency — not the
            original recognised `amount`. Excludes `held` receivables (dispute open;
            see `heldByCurrency`) and is computed after credit netting (v0.5.0). Empty when nothing is outstanding, which
            unblocks `createQuotation`, `acceptQuotation`, and `confirmBooking`.
            Owing and collections are per currency. The accept-block is not
            currency-scoped: those three operations are blocked whenever this
            array is non-empty.
          items:
            $ref: '#/components/schemas/PositiveMoneyAmount'
        outstandingAmount:
          allOf:
            - $ref: '#/components/schemas/PositiveMoneyAmount'
          type: object
          nullable: true
          description: |
            Convenience copy when `outstandingByCurrency` has exactly one entry;
            MUST equal that entry. Null or omitted when outstanding is empty or
            spans more than one currency.
        heldByCurrency:
          type: array
          description: |
            v0.5.0. Commission on `held` receivables (dispute open), one entry per currency,
            sum of their `remainingAmount`. Not owing yet: excluded from
            `outstandingByCurrency` and from the owing gate. Empty when none.
          items:
            $ref: '#/components/schemas/PositiveMoneyAmount'
        creditByCurrency:
          type: array
          description: |
            v0.5.0. Unused commission credit on the transporter's Truber balance, one entry
            per currency with a positive balance. Created when an adjustment or a before-lock
            void reduces commission that was already paid, or when a recorded commission
            collection exceeds what was owed. Same currency only, oldest credit first:
            credit is applied to future commission and, where server policy allows, to outstanding commission. Never applied to `held` receivables. Credit stays on
            the company's balance if the transporter stops using Truber and later returns.
            It is **never refunded in cash**, never paid out, and is not money held by
            Truber. Empty when there is none.
          items:
            $ref: '#/components/schemas/PositiveMoneyAmount'
        receivables:
          type: array
          items:
            $ref: '#/components/schemas/CommissionReceivable'

    CommissionAdjustmentSource:
      type: string
      enum: [party_settlement, admin_decision]
      description: |
        `party_settlement`: the shipper and transporter agreed a lower amount
        (`acceptDisputeSettlement`). `admin_decision`: an admin decided
        (`resolveBookingDispute` with `adjust_amount`, or `recordBookingAdjustment`).

    CommissionAdjustment:
      type: object
      additionalProperties: false
      description: |
        v0.5.0 (user decision 2026-11-11). Append-only record of a trip reversal or reduction;
        never an undo. Same entry type for party settlements and admin decisions. Invariant:
        `previousCommission − newCommission = reducedOpenAmount + creditedAmount`, all in the
        booking currency, all ≥ 0; `newTripAmount ≤ previousTripAmount`. Credit is never
        refunded in cash. Visible to admins and the booking's transporter company only;
        shippers see just `Booking.adjustedAgreedAmount`.
      required:
        - id
        - bookingId
        - receivableId
        - transporterCompanyId
        - source
        - decidedAt
        - previousTripAmount
        - newTripAmount
        - previousCommission
        - newCommission
        - reducedOpenAmount
        - creditedAmount
        - reason
        - recordedByUserId
        - recordedAt
        - fundsMovementClaimedByTruber
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        bookingId:
          $ref: '#/components/schemas/Uuid'
        receivableId:
          $ref: '#/components/schemas/Uuid'
        transporterCompanyId:
          $ref: '#/components/schemas/Uuid'
        disputeRef:
          type: string
          format: uuid
          nullable: true
          description: The `BookingDispute` this settles; null for an admin adjustment without one.
        source:
          $ref: '#/components/schemas/CommissionAdjustmentSource'
        shipperAgreedByUserId:
          type: string
          format: uuid
          nullable: true
          description: Required (non-null) when `source=party_settlement`.
        transporterAgreedByUserId:
          type: string
          format: uuid
          nullable: true
          description: Required (non-null) when `source=party_settlement`.
        decidedAt:
          $ref: '#/components/schemas/DateTime'
        previousTripAmount:
          $ref: '#/components/schemas/NonNegativeMoneyAmount'
        newTripAmount:
          $ref: '#/components/schemas/NonNegativeMoneyAmount'
        previousCommission:
          $ref: '#/components/schemas/NonNegativeMoneyAmount'
        newCommission:
          $ref: '#/components/schemas/NonNegativeMoneyAmount'
        reducedOpenAmount:
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoneyAmount'
          description: Unpaid owing on this trip that was cancelled or reduced.
        creditedAmount:
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoneyAmount'
          description: Already-paid commission moved to commission credit (never refunded in cash).
        reason:
          type: string
          maxLength: 2000
          description: Outcome reason; shown to both parties on the dispute.
        recordedByUserId:
          $ref: '#/components/schemas/Uuid'
        recordedAt:
          $ref: '#/components/schemas/DateTime'
        fundsMovementClaimedByTruber:
          type: boolean
          enum: [false]

    CommissionAdjustmentListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CommissionAdjustment'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    DisputeEvidence:
      type: object
      additionalProperties: false
      required: [kind, uri]
      properties:
        kind:
          type: string
          enum: [photo, signed_pod, message, other]
        uri:
          type: string
          format: uri
        note:
          type: string
          maxLength: 500

    RaiseDisputeRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 4000
        evidence:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/DisputeEvidence'
        proposedAmount:
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoneyAmount'
          description: |
            Optional shipper settlement offer: the agreed amount the shipper would accept.
            Booking currency; not above the current effective agreed amount.

    RespondToDisputeRequest:
      type: object
      additionalProperties: false
      required: [statement]
      properties:
        statement:
          type: string
          minLength: 10
          maxLength: 4000
        evidence:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/DisputeEvidence'
        counterOfferAmount:
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoneyAmount'
          description: |
            Optional transporter counter-offer. Booking currency; not above the current
            effective agreed amount.

    AcceptDisputeSettlementRequest:
      type: object
      additionalProperties: false
      required: [amount]
      properties:
        amount:
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoneyAmount'
          description: Must equal the other side's offer (`proposedAmount` or `counterOfferAmount`).

    DisputeStatus:
      type: string
      enum: [awaiting_transporter_response, transporter_responded, settled, resolved]
      description: |
        v0.5.0 (user decision 2026-11-11). `awaiting_transporter_response` and
        `transporter_responded` are open: the trip is `disputed`, not locked, and commission
        is not final. `settled`: the parties agreed (`settlement`). `resolved`: an admin
        decided (`resolution`). Both closed states lock the trip, except a `cancel_trip`
        resolution, which cancels it.

    BookingDispute:
      type: object
      additionalProperties: false
      description: |
        v0.5.0. A dispute opened by the shipper (at delivery confirmation or inside the
        24-hour window). Visible in full to both booking parties and admins; never carries
        commission or payout figures.
      required: [id, bookingId, stage, raisedByUserId, reason, evidence, status, openedAt, responseDueAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        bookingId:
          $ref: '#/components/schemas/Uuid'
        stage:
          type: string
          enum: [at_delivery_confirmation, dispute_window]
        raisedByUserId:
          $ref: '#/components/schemas/Uuid'
        reason:
          type: string
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/DisputeEvidence'
        proposedAmount:
          type: object
          nullable: true
          required: [amountMinor, currency]
          properties:
            amountMinor:
              type: integer
              minimum: 0
            currency:
              $ref: '#/components/schemas/CurrencyCode'
        status:
          $ref: '#/components/schemas/DisputeStatus'
        openedAt:
          $ref: '#/components/schemas/DateTime'
        responseDueAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: Exactly `openedAt` + 48 hours, server-set.
        response:
          type: object
          nullable: true
          additionalProperties: false
          required: [respondedByUserId, respondedAt, statement, evidence]
          properties:
            respondedByUserId:
              $ref: '#/components/schemas/Uuid'
            respondedAt:
              $ref: '#/components/schemas/DateTime'
            statement:
              type: string
            evidence:
              type: array
              items:
                $ref: '#/components/schemas/DisputeEvidence'
            counterOfferAmount:
              type: object
              nullable: true
              required: [amountMinor, currency]
              properties:
                amountMinor:
                  type: integer
                  minimum: 0
                currency:
                  $ref: '#/components/schemas/CurrencyCode'
        settlement:
          type: object
          nullable: true
          additionalProperties: false
          description: Present when `status=settled`.
          required: [amount, acceptedByUserId, acceptedAt]
          properties:
            amount:
              $ref: '#/components/schemas/NonNegativeMoneyAmount'
            acceptedByUserId:
              $ref: '#/components/schemas/Uuid'
            acceptedAt:
              $ref: '#/components/schemas/DateTime'
            adjustmentId:
              type: string
              format: uuid
              nullable: true
        resolution:
          type: object
          nullable: true
          additionalProperties: false
          description: Present when `status=resolved`. Outcome and reason are shown to both sides.
          required: [outcome, reason, resolvedAt]
          properties:
            outcome:
              type: string
              enum: [complete_trip, adjust_amount, cancel_trip]
            reason:
              type: string
            adjustedAgreedAmount:
              type: object
              nullable: true
              required: [amountMinor, currency]
              properties:
                amountMinor:
                  type: integer
                  minimum: 0
                currency:
                  $ref: '#/components/schemas/CurrencyCode'
            resolvedAt:
              $ref: '#/components/schemas/DateTime'
        closedAt:
          type: string
          format: date-time
          nullable: true

    BookingDisputeListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BookingDispute'

    RecordBookingAdjustmentRequest:
      type: object
      additionalProperties: false
      required: [adjustedAgreedAmount, reason]
      properties:
        adjustedAgreedAmount:
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoneyAmount'
          description: New effective agreed amount; lower than the current one. `0` reverses the trip.
        reason:
          type: string
          minLength: 8
          maxLength: 2000
        disputeId:
          type: string
          format: uuid
          nullable: true
          description: Optional link to a `BookingDispute` this settles (stored as `disputeRef`).

    RecordCommissionCollectionRequest:
      type: object
      description: |
        Records a collection against open commission owing in the given currency.
        Not a live charge. Amount must be positive (QA-007). Applied only to open
        receivables in that currency, oldest-first. Any amount above what is owed becomes
        commission credit (`CommissionCollectionRecord.creditedAmount`), never paid out in
        cash. Mixed-currency collections are rejected.
      required: [amount]
      properties:
        amount:
          $ref: '#/components/schemas/PositiveMoneyAmount'
        externalReference:
          type: string
          maxLength: 200
        notes:
          type: string
          maxLength: 2000

    CommissionCollectionRecord:
      type: object
      required:
        - id
        - companyId
        - amount
        - outstandingAmountAfter
        - outstandingByCurrencyAfter
        - creditedAmount
        - fundsMovementClaimedByTruber
        - recordedAt
        - recordedByUserId
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        companyId:
          $ref: '#/components/schemas/Uuid'
        amount:
          $ref: '#/components/schemas/PositiveMoneyAmount'
        outstandingAmountAfter:
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoneyAmount'
          description: |
            Remaining open owing in the collection's currency after this record
            is applied. `0` if that currency is cleared. Other currencies are
            not included here; see `outstandingByCurrencyAfter`.
        outstandingByCurrencyAfter:
          type: array
          description: |
            Remaining open owing after this collection, one `PositiveMoneyAmount`
            per currency that still has remaining owing. Empty if nothing remains
            in any currency (which unblocks `createQuotation`, `acceptQuotation`,
            and `confirmBooking`). Omits the collection currency when
            `outstandingAmountAfter` is `0`.
          items:
            $ref: '#/components/schemas/PositiveMoneyAmount'
        creditedAmount:
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoneyAmount'
          description: |
            v0.5.0. Part of `amount` above what was owed in that currency (minor units, same
            currency; `0` when none). Held as commission credit against future commission;
            never paid out in cash.
        externalReference:
          type: string
          nullable: true
          maxLength: 200
        notes:
          type: string
          nullable: true
          maxLength: 2000
        fundsMovementClaimedByTruber:
          type: boolean
          enum: [false]
          description: Always false. Collection records are audit/ops only in this contract.
        recordedAt:
          $ref: '#/components/schemas/DateTime'
        recordedByUserId:
          $ref: '#/components/schemas/Uuid'

