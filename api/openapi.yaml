          nullable: true
          description: Required when method is deposit_balance.
        balanceAmount:
          allOf:
            - $ref: '#/components/schemas/MoneyAmount'
          type: object
          nullable: true
          description: Required when method is deposit_balance.
        corporateCreditTermsDays:
          type: integer
          enum: [7, 14, 30]
          nullable: true
          description: Required when method is corporate_credit.
        providerHint:
          type: string
