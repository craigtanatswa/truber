  /payment-arrangements/{arrangementId}:
    get:
      operationId: getPaymentArrangement
      tags: [Payments]
      summary: Get a payment arrangement
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ArrangementId'
      responses:
        '200':
          description: Arrangement
          content:
            application/json:
