  /bookings/{bookingId}/off-platform-reports:
    post:
      operationId: createOffPlatformReport
      tags: [Safeguards, Bookings]
      summary: Report suspected off-platform circumvention on a booking
      description: |
        **User-approved 2026-11-10.** A shipper or transporter member of the booking, or an
        admin/ops user, reports that a party appears to have cancelled or walked away to
        complete the same deal off Truber. Creates an `OffPlatformReport` in status `open`
        with an audit record.

        Filing a report never bans anyone, never changes the booking, and never blocks
        either party. Only an admin finding (`recordOffPlatformFinding`) can lead to a ban.
        The system does not detect circumvention automatically, and a legitimate cancel
        (for example a breakdown or goods not ready) never creates a report by itself.
        A banned user may still file a report. Non-parties get 403/404.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOffPlatformReportRequest'
      responses:
        '201':
          description: Report filed (pending admin review)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OffPlatformReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/off-platform-reports:
    get:
      operationId: listOffPlatformReports
      tags: [Safeguards, Admin]
      summary: List off-platform circumvention reports (admin)
      description: Admin-only review queue (user-approved 2026-11-10). Records only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OffPlatformReportStatus'
        - name: bookingId
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: companyId
          in: query
          description: Reports on bookings where this company is the shipper or transporter
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Paginated reports
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OffPlatformReportListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/off-platform-reports/{reportId}:
    get:
      operationId: getOffPlatformReport
      tags: [Safeguards, Admin]
      summary: View one off-platform report with its finding and bans (admin)
      description: Admin-only (user-approved 2026-11-10).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OffPlatformReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/off-platform-reports/{reportId}/finding:
    post:
      operationId: recordOffPlatformFinding
      tags: [Safeguards, Admin]
      summary: Record the admin finding on a report; a confirmed finding applies 14-day bans
      description: |
        **User-approved 2026-11-10.** Admin-only. Records the review outcome with a reason
        and an audit record (`reviewedByUserId`, `reviewedAt`). One finding per report;
        a second call returns 409.

        - `not_confirmed`: no ban. Report status becomes `not_confirmed`.
        - `confirmed`: `responsibleParties` is required (1 or 2 entries: shipper,
          transporter, or both). In the same atomic step the server applies one
          `OffPlatformBan` per responsible party, covering that **user and their company**.
          Each ban runs **14 days from application**: `startsAt` = server time of this
          call, `endsAt` = `startsAt` + 14 days. The duration is fixed by the server; the
          request has no duration field and unknown fields are rejected (400). The
          applying admin is `appliedByUserId`. Report status becomes `confirmed`.

        Each responsible party's user must be a member of the named company, and the
        company must be the booking's shipper or transporter company for the stated role
        (400/409 otherwise). A ban never changes `accountStatus` and never hides existing
        records.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordOffPlatformFindingRequest'
      responses:
        '201':
          description: Finding recorded (with bans when confirmed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OffPlatformFinding'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/off-platform-bans:
    get:
      operationId: listOffPlatformBans
      tags: [Safeguards, Admin]
      summary: List off-platform bans (admin)
      description: |
        Admin-only (user-approved 2026-11-10). `status` is server-computed:
        `active` while `startsAt <= now < endsAt` and not lifted; `expired` once
        `now >= endsAt`; `lifted` when an admin lifted it early.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OffPlatformBanStatus'
        - name: userId
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: companyId
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Paginated bans
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OffPlatformBanListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/off-platform-bans/{banId}/lift:
    post:
      operationId: liftOffPlatformBan
      tags: [Safeguards, Admin]
      summary: Lift an off-platform ban early (admin, audited)
      description: |
        **User-approved 2026-11-10.** Admin-only. Ends an `active` ban before `endsAt`
        (for example when the finding was wrong). Requires `liftReason`; records
        `liftedAt`, `liftedByUserId`, and `liftReason`. `endsAt` is kept as originally
        applied. Lifting an `expired` or already `lifted` ban returns 409. The ban
        otherwise expires automatically at `endsAt`; no call is needed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BanId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiftOffPlatformBanRequest'
      responses:
        '200':
          description: Ban lifted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OffPlatformBan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token. Claims must include at least `sub` (user id) and `role`
        (`shipper` | `transporter` | `admin`). Refresh tokens are opaque and used only
        with `/auth/refresh`.

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CompanyId:
      name: companyId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TruckId:
      name: truckId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    LoadId:
      name: loadId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    QuotationId:
      name: quotationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ArrangementId:
      name: arrangementId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    BanId:
      name: banId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    Page:
      name: page
      in: query
      description: 1-based page index
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Page size (max 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Optional on reads; **strongly recommended** (and may be required by server) on
        confirmation and create-once writes. Replays with the same key and equivalent body
        return the original result without re-applying side effects.
      schema:
        type: string
        minLength: 8
        maxLength: 128

  responses:
    BadRequest:
      description: Malformed request or failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found (or not visible)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: State conflict, duplicate, or failed precondition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NewWorkGateConflict:
      description: |
        Conflict on a new-work operation (`createQuotation`, `acceptQuotation`).
        Replaces v0.3.0 `CommissionOutstandingOrConflict` (same commission semantics).
        - Active off-platform ban (user-approved 2026-11-10): body MUST be
          `AccountBannedError` (`code: ACCOUNT_BANNED`, required `details.bannedUntil`).
          Checked first.
        - Unpaid commission owing (user-approved 2026-11-09): body MUST be
          `CommissionOutstandingError` (pinned `code: COMMISSION_OUTSTANDING`, required
          `details.outstandingByCurrency`; `details.outstandingAmount` also required
          when owing is in exactly one currency).
        - Other conflicts use `OtherConflictError`.
        The three branches are mutually exclusive by `code`, so exactly one matches.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/CommissionOutstandingError'
              - $ref: '#/components/schemas/AccountBannedError'
              - $ref: '#/components/schemas/OtherConflictError'
    AccountBannedOrConflict:
      description: |
        Conflict on load posting (`createLoad`, `postLoad`). Active off-platform ban
        (user-approved 2026-11-10) MUST use `AccountBannedError`; other conflicts use
        `OtherConflictError`.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/AccountBannedError'
              - $ref: '#/components/schemas/OtherConflictError'
    SelfCancelOrConflict:
      description: |
        Conflict on a cancel/withdraw path. A shipper or transporter trying to cancel
        after a quotation is accepted or a booking exists (user-approved 2026-11-10)
        MUST receive `SelfCancelNotAllowedError` (`code: SELF_CANCEL_NOT_ALLOWED`).
        Other conflicts use `OtherConflictError`.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/SelfCancelNotAllowedError'
              - $ref: '#/components/schemas/OtherConflictError'
    UnprocessableEntity:
      description: Semantically invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Uuid:
      type: string
      format: uuid

    DateTime:
      type: string
      format: date-time

    CurrencyCode:
      type: string
      description: ISO 4217 currency code (e.g. USD, ZWG)
      pattern: '^[A-Z]{3}$'
      example: USD

    MoneyAmount:
      type: object
      description: |
        Integer minor units plus ISO 4217 currency. Never floating-point.
        Prefer PositiveMoneyAmount / NonNegativeMoneyAmount on write paths.
        Commission: half-up to minor unit at 500 bps (5%), recognised at trip completion.
        Fees are separate fields, deducted from the transporter payout (user-approved
        2026-11-09). Server-compute commission; never use floating-point.
      required: [amountMinor, currency]
      properties:
        amountMinor:
          type: integer
          description: Minor units; sign/zero rules depend on the referencing schema
        currency:
          $ref: '#/components/schemas/CurrencyCode'

    PositiveMoneyAmount:
      type: object
      description: |
        Strictly positive money (QA-007). Use for quotation amounts, arrangement totals,
        deposits, balances, trip amounts used as commission base.
      required: [amountMinor, currency]
      properties:
        amountMinor:
          type: integer
          minimum: 1
          description: Must be >= 1 minor unit
        currency:
          $ref: '#/components/schemas/CurrencyCode'

    NonNegativeMoneyAmount:
      type: object
      description: |
        Zero or positive money (QA-007). Legitimate zeros allowed for processing fees or
        computed commission only where the trip amount rounds to a representable 5% of 0
        (trip amount itself must still be positive). Never negative.
      required: [amountMinor, currency]
      properties:
        amountMinor:
          type: integer
          minimum: 0
          description: Must be >= 0; zero is meaningful for fees/commission edge cases only
        currency:
          $ref: '#/components/schemas/CurrencyCode'


    PaginationMeta:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-stable error code (e.g. BOOKING_CONFIRM_REQUIRES_ARRANGEMENT)
        message:
          type: string
          description: Human-readable summary
        details:
          type: object
          additionalProperties: true
          description: Optional structured detail
        requestId:
          type: string

    CommissionOutstandingError:
      type: object
      additionalProperties: false
      description: |
        Pinned 409 body when a transporter cannot take new work because commission
        is outstanding. Not the generic `Error` schema — `code` is the singleton
        `COMMISSION_OUTSTANDING`. `details.outstandingByCurrency` is required (owing
        is per currency). When owing is in exactly one currency, `details.outstandingAmount`
        is also required and MUST equal that single entry. Used by `createQuotation`,
        `acceptQuotation`, and `confirmBooking`.
      required: [code, message, details]
      properties:
        code:
          type: string
          enum: [COMMISSION_OUTSTANDING]
        message:
          type: string
          enum:
            - Outstanding commission must be settled before taking new work.
        details:
          oneOf:
            - type: object
              additionalProperties: false
              required: [outstandingAmount, outstandingByCurrency]
              properties:
                outstandingAmount:
                  allOf:
                    - $ref: '#/components/schemas/PositiveMoneyAmount'
                  description: |
                    Required when owing is in exactly one currency. MUST equal the
                    sole `outstandingByCurrency` entry (sum of open `remainingAmount`
                    in that currency).
                outstandingByCurrency:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    $ref: '#/components/schemas/PositiveMoneyAmount'
            - type: object
              additionalProperties: false
              required: [outstandingByCurrency]
              properties:
                outstandingByCurrency:
                  type: array
                  minItems: 2
                  items:
                    $ref: '#/components/schemas/PositiveMoneyAmount'
                  description: |
                    One positive amount per currency with unpaid remaining commission.
                    Present when owing spans more than one currency; do not also send
                    a single `outstandingAmount`.
        requestId:
          type: string

    OtherConflictError:
      description: |
        Generic conflict body on responses that also carry a pinned error schema.
        Same shape as `Error`, but `code` MUST NOT be one of the pinned codes
        (`COMMISSION_OUTSTANDING`, `ACCOUNT_BANNED`, `SELF_CANCEL_NOT_ALLOWED`). This keeps
        each shared 409 `oneOf` exclusive: a pinned body matches only its own schema.
        (Fixes v0.3.0, where a valid `CommissionOutstandingError` body also matched
        generic `Error` and so failed the `oneOf`.)
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            code:
              not:
                enum: [COMMISSION_OUTSTANDING, ACCOUNT_BANNED, SELF_CANCEL_NOT_ALLOWED]

    AccountBannedError:
      type: object
      additionalProperties: false
      description: |
        Pinned 409 body (user-approved 2026-11-10) when a user or company with an active
        off-platform ban tries `createLoad`, `postLoad`, `createQuotation`,
        `acceptQuotation`, or `confirmBooking`. Distinct from `CommissionOutstandingError`
        (`code` is the singleton `ACCOUNT_BANNED`). Admin `auditOverride` cannot bypass it.
      required: [code, message, details]
      properties:
        code:
          type: string
          enum: [ACCOUNT_BANNED]
        message:
          type: string
          enum:
            - This account is temporarily banned from new work on Truber.
        details:
          type: object
          additionalProperties: false
          required: [bannedUntil, bannedParty]
          properties:
            bannedUntil:
              allOf:
                - $ref: '#/components/schemas/DateTime'
              description: |
                Latest `endsAt` among the active bans that block this request. The block
                clears automatically at this time unless an admin lifts it earlier.
            bannedParty:
              type: string
              enum: [caller, caller_company, counterparty_company]
              description: |
                Which party's ban blocks the request. `counterparty_company` is used when
                the other side of the deal (for example the quotation's transporter on
                `acceptQuotation`) is banned. Ban reasons are never disclosed here.
        requestId:
          type: string

    SelfCancelNotAllowedError:
      type: object
      additionalProperties: false
      description: |
        Pinned 409 body (user-approved 2026-11-10) when a shipper or transporter tries to
        cancel or walk away after a quotation is accepted or a booking exists (including
        `pending_payment_arrangement`). Only admin can record the cancellation
        (`cancelBooking`, audited reason).
      required: [code, message, details]
      properties:
        code:
          type: string
          enum: [SELF_CANCEL_NOT_ALLOWED]
        message:
          type: string
          enum:
            - This booking can only be cancelled by Truber admin. Contact support.
        details:
          type: object
          additionalProperties: false
          required: [bookingId, bookingStatus]
          properties:
            bookingId:
              $ref: '#/components/schemas/Uuid'
            bookingStatus:
              $ref: '#/components/schemas/BookingStatus'
        requestId:
          type: string

    OffPlatformPartyRole:
      type: string
      enum: [shipper, transporter]

    OffPlatformReportStatus:
      type: string
      enum: [open, confirmed, not_confirmed]
      description: |
        `open` until an admin records a finding. `confirmed` / `not_confirmed` mirror the
        finding outcome (user-approved 2026-11-10).

    CreateOffPlatformReportRequest:
      type: object
      additionalProperties: false
      required: [suspectedParty, description]
      properties:
        suspectedParty:
          type: string
          enum: [shipper, transporter, both, unknown]
        description:
          type: string
          minLength: 10
          maxLength: 4000
          description: What happened and why off-platform dealing is suspected.
        evidenceUris:
          type: array
          maxItems: 20
          items:
            type: string
            format: uri

    OffPlatformReport:
      type: object
      required:
        - id
        - bookingId
        - reportedByUserId
        - suspectedParty
        - description
        - status
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        bookingId:
          $ref: '#/components/schemas/Uuid'
        reportedByUserId:
          $ref: '#/components/schemas/Uuid'
        reporterRole:
          $ref: '#/components/schemas/UserRole'
        suspectedParty:
          type: string
          enum: [shipper, transporter, both, unknown]
        description:
          type: string
        evidenceUris:
          type: array
          items:
            type: string
            format: uri
        status:
          $ref: '#/components/schemas/OffPlatformReportStatus'
        finding:
          allOf:
            - $ref: '#/components/schemas/OffPlatformFinding'
          type: object
          nullable: true
          description: Present once an admin has recorded a finding. Admin views only.
        createdAt:
          $ref: '#/components/schemas/DateTime'

    OffPlatformReportListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OffPlatformReport'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    OffPlatformResponsibleParty:
      type: object
      additionalProperties: false
      required: [role, userId, companyId]
      properties:
        role:
          $ref: '#/components/schemas/OffPlatformPartyRole'
        userId:
          $ref: '#/components/schemas/Uuid'
        companyId:
          $ref: '#/components/schemas/Uuid'

    RecordOffPlatformFindingRequest:
      type: object
      additionalProperties: false
      description: |
        Admin finding (user-approved 2026-11-10). No duration field: a confirmed finding
        always applies a 14-day ban per responsible party. Unknown fields are rejected.
      required: [outcome, reason]
      properties:
        outcome:
          type: string
          enum: [confirmed, not_confirmed]
        reason:
          type: string
          minLength: 8
          maxLength: 4000
          description: Audited reason for the outcome.
        responsibleParties:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/OffPlatformResponsibleParty'
          description: |
            Required when `outcome=confirmed`; must be omitted when `not_confirmed`.
            At most one entry per role (shipper, transporter, or both).
      oneOf:
        - required: [responsibleParties]
          properties:
            outcome:
              enum: [confirmed]
        - not:
            type: object
            required: [responsibleParties]
            properties:
              responsibleParties:
                type: array
          properties:
            outcome:
              enum: [not_confirmed]

    OffPlatformFinding:
      type: object
      required: [id, reportId, bookingId, outcome, reason, reviewedByUserId, reviewedAt, bans]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        reportId:
          $ref: '#/components/schemas/Uuid'
        bookingId:
          $ref: '#/components/schemas/Uuid'
        outcome:
          type: string
          enum: [confirmed, not_confirmed]
        reason:
          type: string
        responsibleParties:
          type: array
          items:
            $ref: '#/components/schemas/OffPlatformResponsibleParty'
        reviewedByUserId:
          $ref: '#/components/schemas/Uuid'
        reviewedAt:
          $ref: '#/components/schemas/DateTime'
        bans:
          type: array
          description: Bans applied by this finding. Empty when `not_confirmed`.
          items:
            $ref: '#/components/schemas/OffPlatformBan'

    OffPlatformBanStatus:
      type: string
      enum: [active, expired, lifted]
      description: |
        Server-computed. `active`: `startsAt <= now < endsAt` and not lifted. `expired`:
        `now >= endsAt` (automatic; no call needed). `lifted`: admin lifted it early.

    OffPlatformBan:
      type: object
      description: |
        Time-limited ban (user-approved 2026-11-10) on one responsible user **and** their
        company. While `active`, that user and any member acting for that company cannot
        `createLoad`, `postLoad`, `createQuotation`, `acceptQuotation`, or `confirmBooking`
        (409 `AccountBannedError`). Existing records stay visible; `accountStatus` is not
        changed. Not permanent.
      required:
        - id
        - findingId
        - userId
        - companyId
        - partyRole
        - status
        - startsAt
        - endsAt
        - durationDays
        - reason
        - appliedByUserId
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        findingId:
          $ref: '#/components/schemas/Uuid'
        userId:
          $ref: '#/components/schemas/Uuid'
        companyId:
          $ref: '#/components/schemas/Uuid'
        partyRole:
          $ref: '#/components/schemas/OffPlatformPartyRole'
        status:
          $ref: '#/components/schemas/OffPlatformBanStatus'
        startsAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: Server time when the confirmed finding was recorded.
        endsAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          description: Exactly `startsAt` + 14 days (336 hours). Never client-supplied.
        durationDays:
          type: integer
          enum: [14]
          readOnly: true
          description: Fixed at 14 (user-approved 2026-11-10). Not configurable.
        reason:
          type: string
          description: Copied from the confirmed finding's audited reason.
        appliedByUserId:
          $ref: '#/components/schemas/Uuid'
        liftedAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          type: string
          nullable: true
        liftedByUserId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          type: string
          nullable: true
        liftReason:
          type: string
          nullable: true

    OffPlatformBanListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OffPlatformBan'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    LiftOffPlatformBanRequest:
      type: object
      additionalProperties: false
      required: [liftReason]
      properties:
        liftReason:
          type: string
          minLength: 8
          maxLength: 4000
          description: Audited reason for lifting early.

    UserRole:
      type: string
      enum: [shipper, transporter, admin]
      description: Public signup allows only shipper or transporter.

    PublicSignupRole:
      type: string
      enum: [shipper, transporter]
      description: Roles permitted on public registration.

    AccountStatus:
      type: string
      enum: [pending_verification, active, suspended, disabled]

    VerificationStatus:
      type: string
      enum: [unverified, pending, verified, rejected]

    Password:
      type: string
      format: password
      minLength: 8
      description: |
        Shared MVP password policy (register, admin provision, password-reset confirm):
        minimum 8 characters. Additional complexity/max-length rules are an open product
        question and must not be invented here. Never log or return password values.

    RegisterRequest:
      type: object
      required: [email, password, fullName, role]
      properties:
        email:
          type: string
          format: email
        password:
          $ref: '#/components/schemas/Password'
        fullName:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          type: string
          maxLength: 32
        city:
          type: string
          minLength: 1
          maxLength: 120
          description: |
            Optional primary city (QA-026, user-approved 2026-11-07). Omit when unknown —
            absence is valid. No fabricated default; not required for registration.
        role:
          $ref: '#/components/schemas/PublicSignupRole'

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          description: Submitted password (not validated for minLength on login to avoid policy leakage via length probes).

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: Opaque refresh token; never log in full.

    ProvisionAdminRequest:
      type: object
      required: [email, password, fullName]
      properties:
        email:
          type: string
          format: email
        password:
          $ref: '#/components/schemas/Password'
        fullName:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          type: string
          maxLength: 32

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 320
          pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
          description: |
            Target address; existence is never revealed by the response.
            Pattern supplements `format: email` so empty/malformed values fail schema
            validation under OAS instance validators that soft-handle format alone.

    PasswordResetRequestAccepted:
      type: object
      additionalProperties: false
      description: |
        Uniform acceptance payload (QA-027). Only `status` + pinned `message` are allowed —
        undeclared keys (token, userId, accessToken, etc.) are schema-invalid.
        Identical for all account/deliverability outcomes (anti-enumeration).
      required: [status, message]
      properties:
        status:
          type: string
          enum: [accepted]
        message:
          type: string
          enum:
            - If an account exists for this email, password reset instructions will be sent when permitted.

    PasswordResetToken:
      type: string
      minLength: 32
      maxLength: 512
      pattern: '^\S+$'
      description: |
        Opaque single-use reset token delivered only via configured email. Never returned by
        request endpoint; never log plaintext.
        **Approved with API v0.2.0 publish (2026-11-07):** TTL 30 minutes.

    PasswordResetConfirmRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          $ref: '#/components/schemas/PasswordResetToken'
        newPassword:
          $ref: '#/components/schemas/Password'

    PasswordResetConfirmResponse:
      type: object
      additionalProperties: false
      description: |
        Confirm success payload (QA-027). Only documented fields; undeclared keys
        (accessToken, refreshToken, token, etc.) are schema-invalid. Does not issue sessions.
      required: [status, refreshSessionsInvalidated]
      properties:
        status:
          type: string
          enum: [password_changed]
        refreshSessionsInvalidated:
          type: boolean
          enum: [true]
          description: Always true on success — all refresh sessions for the user are revoked.

    PasswordResetConfirmTokenError:
      type: object
      additionalProperties: false
      description: |
        Dedicated confirm-401 body (QA-028). Explicit schema — not a composition with
        generic `Error` — so `details` / free-form codes cannot leak token state.
        Unknown, expired, consumed, and malformed tokens MUST use this exact `code` and
        `message` (OpenAPI 3.0 singleton enums). Generic `Error` elsewhere is unchanged.
      required: [code, message]
      properties:
        code:
          type: string
          enum: [PASSWORD_RESET_TOKEN_INVALID]
        message:
          type: string
          enum:
            - Password reset token is invalid or no longer usable.

    AuthTokenResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          minimum: 1
          description: |
            Access token lifetime in seconds from issuance.
            **User-approved 2026-11-07** ("I approve them but increase sign in sessions to 30
            minutes"): **1800** (30 minutes), replacing the earlier 900 (15 minutes).
            After password reset, refresh is revoked but access JWTs
            issued earlier remain valid until this natural expiry (residual exposure window).
            Do not treat other text as implying immediate access revocation.
        user:
          $ref: '#/components/schemas/User'

