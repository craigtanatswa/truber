  /bookings/{bookingId}/delivery-confirmation:
    get:
      operationId: getDeliveryConfirmation
      tags: [DeliveryConfirmation]
      summary: Get shipper delivery confirmation state
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Confirmation state (may be null body fields if not yet confirmed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryConfirmation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: confirmDelivery
      tags: [DeliveryConfirmation]
      summary: Shipper confirms delivery acceptance
      description: |
        Shipper delivery acceptance/dispute (QA-008/QA-003/QA-005). Distinct from transporter
        POD and from `tripStatus=delivered`.

        **Preconditions:** at least one POD artifact must exist for the booking (409 otherwise).
        On `accepted`: `completionStatus` → `completed` (**provisional** Charlie policy —
        completion is separate from release). Does not move funds and does not record release.
        **Commission recognition (user-approved 2026-11-09):** the server creates an open
        commission receivable for the transporter company, amount = half-up 5% of
        `booking.agreedAmount` (minor units, same currency). Recognition is at completion,
        not at release. If an admin later voids that completion (cancel/refund), the
        receivable is `voided` and recognised revenue is reversed. For `cash`, the
        receivable remains a collect-later owing; no fare payout due is booked.
        On `disputed`: `completionStatus` → `disputed`; release endpoints return 409 until
        admin resolves the dispute via `POST /bookings/{bookingId}/disputes/resolve`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
