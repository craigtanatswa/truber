  /quotations/payout-preview:
    post:
      operationId: previewQuotationPayout
      tags: [Quotations, Payments]
      summary: Preview the transporter net payout for a proposed quote amount (no side effects)
      description: |
        **v0.5.0.** Lets the transporter app show "you will receive" for a
        quote amount it is about to submit, so the app never computes commission or net itself.

        Server-computed, side-effect free: creates no quotation, no booking, no receivable,
        no idempotency record. Allowed for a banned transporter or one owing commission (it
        is a read-only calculation). The response lists `submissionBlockers` so the UI can
        warn before submitting; they use the existing pinned codes `ACCOUNT_BANNED` and
        `COMMISSION_OUTSTANDING`. Submission itself stays gated: `createQuotation` still
        returns 409 `AccountBannedError` / `CommissionOutstandingError`.

        Rules (user-approved 2026-11-09):
        - The shipper pays the full agreed amount; commission and fees come out of the
          transporter payout (never added on for the shipper).
        - `commissionAmount` = half-up 5% (`commissionRateBps` 500) of `amount`, integer
          minor units.
        - `netPayoutBeforeUnknownFees = agreedAmount − commissionAmount − knownFeesTotal`.

        **Provider fees are not confirmed.** Truber has no contracted payment provider
        (Paynow, EcoCash, InnBucks are candidates only; research `research/payments.md`
        2026-11-06 lists published or secondary rates but no Truber contract). The server
        therefore never reports an unknown fee as 0: `feeStatus` is `unknown` and
        `unknownFees` lists the fee that may still apply. Processing fees become known only
        when an actual transaction records them (`recordPaymentTransaction.processingFee`).

        For `paymentMethod=cash`, Truber never holds the fare: `farePayoutDueThroughTruber`
        is false and the commission is a receivable the transporter owes later.
        `netPayoutBeforeUnknownFees` is still returned as what the transporter keeps after
        the commission they owe.

        **Company scope:** `transporterCompanyId` is required (same field as
        `createQuotation`). The caller must be a member of that company; admin must name it
        explicitly and gets no default tenant. Bans, owing and `submissionBlockers` are
        computed for that company (and the calling user's own ban) only.

        400 if `amount` is not a strictly positive integer amount, or if `loadId` is given and
        `amount.currency` differs from the load currency (`CURRENCY_MISMATCH`). 403 for a
        caller who is not a transporter (or admin), or if the named company is not a
        transporter company (`COMPANY_TYPE_MISMATCH`). 404 if the company does not exist or
        the caller is not a member of it (the shared `NotFound` body; existence is not
        revealed, matching the implemented company-scoped writes such as `createLoad`), or if
        `loadId` is not visible to the caller.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutPreviewRequest'
      responses:
        '200':
          description: Computed preview (nothing stored)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutPreview'
              examples:
                noBlockers:
                  summary: Prepay quote, nothing blocks submission
                  value:
                    agreedAmount: { amountMinor: 100000, currency: USD }
                    commissionRateBps: 500
                    commissionAmount: { amountMinor: 5000, currency: USD }
                    knownFees: []
                    knownFeesTotal: { amountMinor: 0, currency: USD }
                    netPayoutBeforeUnknownFees: { amountMinor: 95000, currency: USD }
                    feeStatus: unknown
                    unknownFees:
                      - feeType: processing_fee
                        reason: provider_not_contracted
                    paymentMethod: prepay
                    farePayoutDueThroughTruber: true
                    paymentProtectedPossible: true
                    submissionBlockers: []
                bothBlockers:
                  summary: Banned and owing commission in one currency (preview still allowed)
                  value:
                    agreedAmount: { amountMinor: 25010, currency: USD }
                    commissionRateBps: 500
                    commissionAmount: { amountMinor: 1251, currency: USD }
                    knownFees: []
                    knownFeesTotal: { amountMinor: 0, currency: USD }
                    netPayoutBeforeUnknownFees: { amountMinor: 23759, currency: USD }
                    feeStatus: unknown
                    unknownFees:
                      - feeType: processing_fee
                        reason: provider_not_contracted
                    paymentMethod: escrow
                    farePayoutDueThroughTruber: true
                    paymentProtectedPossible: true
                    submissionBlockers:
                      - code: ACCOUNT_BANNED
                        details:
                          bannedUntil: '2026-11-24T09:00:00Z'
                      - code: COMMISSION_OUTSTANDING
                        details:
                          outstandingAmount: { amountMinor: 1500, currency: USD }
                          outstandingByCurrency:
                            - { amountMinor: 1500, currency: USD }
                owingTwoCurrencies:
                  summary: Cash quote, owing in two currencies
                  value:
                    agreedAmount: { amountMinor: 50000, currency: USD }
                    commissionRateBps: 500
                    commissionAmount: { amountMinor: 2500, currency: USD }
                    knownFees: []
                    knownFeesTotal: { amountMinor: 0, currency: USD }
                    netPayoutBeforeUnknownFees: { amountMinor: 47500, currency: USD }
                    feeStatus: not_applicable
                    unknownFees: []
                    paymentMethod: cash
                    farePayoutDueThroughTruber: false
                    paymentProtectedPossible: false
                    submissionBlockers:
                      - code: COMMISSION_OUTSTANDING
                        details:
                          outstandingByCurrency:
                            - { amountMinor: 1500, currency: USD }
                            - { amountMinor: 40000, currency: ZWG }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

