          $ref: '#/components/schemas/DateTime'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'

    CreateQuotationRequest:
      type: object
      required: [transporterCompanyId, amount, validUntil]
      properties:
