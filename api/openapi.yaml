      operationId: recordProtectionEvidence
      tags: [Payments, Admin]
      summary: Record independent-provider secured-funds evidence (admin/ops)
      description: |
        Attaches evidence that an authorised independent provider is holding funds for
        an escrow (or similar protected) arrangement. Sets `protectionStatus=protected`
        only when evidence is accepted by server rules.

        Never available to shipper/transporter as a self-asserted protection claim.
        Does not integrate live Paynow/EcoCash/InnBucks APIs in MVP — stores references
        and notes only. Cash arrangements reject this call (400/409).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ArrangementId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProtectionEvidenceRequest'
      responses:
        '200':
          description: Evidence recorded; protection status updated when rules pass
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentArrangement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

