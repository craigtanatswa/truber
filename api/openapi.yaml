  /payment-arrangements/{arrangementId}/confirm:
    post:
      operationId: confirmPaymentArrangement
      tags: [Payments]
      summary: Server-side confirm a payment arrangement (admin/ops for MVP)
      description: |
        Confirms the arrangement after Truber has verified the plan. **MVP: admin/ops only.**
        Clients cannot self-confirm payment or protection.

        Method preconditions (409 otherwise):
        - `deposit_balance`: a deposit **receipt** must already be recorded
          (`POST .../deposit-receipt`) — provisional policy §4.
        - `corporate_credit`: shipper company credit account must be `approved` and an
          **atomic** capacity reservation for `totalAmount` must succeed (QA-011).
        - `escrow`: `protectionStatus=protected` with independent-provider evidence
          (attachable here by admin only).
        - `cash`: `protectionStatus` remains `none`.
        - `prepay`: arrangement plan verified; transaction records remain separate.

        On success: `arrangementStatus=confirmed`. Does not confirm the booking.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ArrangementId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPaymentArrangementRequest'
      responses:
        '200':
          description: Arrangement confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentArrangement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

