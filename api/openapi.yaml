      summary: Submit a quotation (transporter)
      description: |
        Load must be `posted` or `quoting`. One open (`submitted`) quotation per transporter
        company per load (409 on duplicate — amendments via withdraw+resubmit still open).
        **Verification gate (QA-006):** transporter company must be `verified`, caller account
        `active`, and if `truckId` is supplied that truck must be `verified`; otherwise 403/409.
        Quotation `amount` must be strictly positive (QA-007).
      security:
