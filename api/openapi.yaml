          type: string
          maxLength: 1000

    QuotationStatus:
      type: string
      enum: [submitted, withdrawn, accepted, not_selected, rejected, expired]
      description: |
        `not_selected` (provisional Charlie policy, not user-approved): siblings when another
        quote is accepted; recoverable if the pending booking fails before confirmation.
        `rejected` remains for explicit rejection paths distinct from non-selection.

    Quotation:
      type: object
      required:
        - id
        - loadId
        - transporterCompanyId
        - amount
        - status
        - validUntil
        - createdAt
        - updatedAt
