      type: object
      required: [tripStatus]
      properties:
        tripStatus:
          $ref: '#/components/schemas/TripStatus'
        note:
          type: string
          maxLength: 1000

    PaymentMethod:
      type: string
      enum:
        - prepay
        - escrow
        - deposit_balance
        - cash
        - corporate_credit
      description: |
        `cash` is never payment-protected. `escrow` requires independent-provider evidence
        for protection. Provider brand names are not claimed as integrated.

    ArrangementStatus:
      type: string
      enum: [proposed, confirmed, rejected, cancelled]
      description: Whether Truber has confirmed the payment plan for the booking.

    TransactionPaymentStatus:
      type: string
      enum: [unpaid, partially_paid, paid, refunded, failed]
      description: Status of recorded money movement for a transaction — not arrangement or protection.

    ProtectionStatus:
      type: string
      enum:
        - none
        - pending_evidence
        - protected
        - protection_failed
        - released_from_protection
      description: |
        Escrow/protected hold state. Always `none` for cash. `protected` requires
        server-accepted independent-provider evidence — never client self-assertion.

    ReleaseStatus:
      type: string
      enum:
        - not_applicable
        - held
        - release_requested
        - released_recorded
        - release_failed
      description: |
        Release tracking. `released_recorded` means an audit/ops record exists; it does
        not assert Truber moved funds.

    PaymentArrangement:
      type: object
      required:
        - id
        - bookingId
        - method
        - arrangementStatus
        - protectionStatus
        - releaseStatus
        - totalAmount
        - createdAt
        - updatedAt
      properties:
