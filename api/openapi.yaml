  /companies/{companyId}/commission-account:
    get:
      operationId: getCompanyCommissionAccount
      tags: [Companies, Payments]
      summary: Get transporter commission owing and history
      description: |
        Returns the transporter company's commission receivables and outstanding
        balances, plus (v0.5.0) `heldByCurrency` (dispute open, not owing yet, not gated)
        and `creditByCurrency` (commission credit, never refunded in cash). Members of the
        transporter company and admins only; shippers never see commission internals. `outstandingByCurrency` is the sum of `remainingAmount` on `open`
        receivables, one entry per currency (not the original recognised `amount`).
        Created at trip completion (user-approved 2026-11-09). Load search and view
        remain allowed with outstanding owing; `createQuotation`, `acceptQuotation`,
        and `confirmBooking` return 409 `CommissionOutstandingError` until there is
        no remaining owing in any currency. Records only — this endpoint does not
        collect funds. Collections are per currency. The accept-block is not
        currency-scoped: all three operations are blocked whenever any currency
        has remaining owing.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          description: Commission account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/companies/{companyId}/commission-collections:
    post:
      operationId: recordCommissionCollection
      tags: [Admin, Payments]
      summary: Record collection of outstanding commission (records only)
      description: |
        Admin/ops records that a transporter paid (or partially paid) outstanding
        commission owing, typically for cash trips where Truber never held the fare
        (user-approved 2026-11-09 — collect later). **Recording a collection is not
        moving funds.** No live provider API and no automatic debit.

        `amount` must be strictly positive and in one currency. Applied only to `open`
        receivables in that currency (never `held`), oldest-first, updating each
        receivable's `collectedAmount` and `remainingAmount`. When a receivable's
        `remainingAmount` reaches zero, its status becomes `collected`.
        **Overpayment (user decision 2026-11-11):** an `amount` greater than what is owed in
        that currency is accepted. The excess is recorded as `creditedAmount` and held as
        commission credit against future commission (`CommissionAccount.creditByCurrency`);
        it is never paid out in cash. After this call, if
        `outstandingByCurrency` is empty, `createQuotation`, `acceptQuotation`, and
        `confirmBooking` are unblocked.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordCommissionCollectionRequest'
      responses:
        '201':
          description: Collection recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionCollectionRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
