openapi: 3.0.3
info:
  title: Truber API
  version: 0.2.0
  description: |
    Truber API v0.2.0 — **authoritative** contract (published 2026-11-07 Africa/Harare).
    User approval: publish card reply `Publish v0.2.0 as is` (Charlie transcript).
    Scope includes MVP core plus password-reset, optional city (QA-026), and the Charlie
    provisional package **as encoded in the approved draft** (now published with this version).
    Historical approved draft snapshot: `api/releases/openapi-v0.2.0-draft-approved-snapshot.yaml`.
    Previous v0.1.0 backup: `api/releases/openapi-v0.1.0.yaml`.
    **Not implemented:** no NestJS runtime, no live Paynow/EcoCash/InnBucks/BuySafe integrations,
    fee payer unresolved, repository access unresolved.

    Hard rules retained/strengthened from v0.1.0:
    - Public signup never grants `admin`.
    - Booking confirm requires server-confirmed payment arrangement for the same booking;
      escrow requires `protectionStatus=protected` with independent-provider evidence.
      **Shipper** is the primary booking confirmer; **admin** may act with an audit record but
      **never bypasses** the payment-arrangement / protection gate.
    - Clients cannot self-confirm payment or protection.
    - Cash never protected. No Truber wallet/float. No live Paynow/EcoCash/InnBucks APIs.
    - Release is a manually recorded ops audit only; recording never claims funds moved.
    - Commission 5% half-up to minor unit; processing fees separate (fee payer unresolved).
    - Deposit splits are configurable (example 50/50); no fixed rate in the contract.
    - POD and shipper delivery confirmation are distinct; trip completion ≠ release.

  contact:
    name: Truber Backend
  license:
    name: Proprietary
    url: https://truber.example/license

servers:
  - url: https://api.truber.example/v0
    description: Placeholder base URL (not deployed)

tags:
  - name: Auth
    description: |
      Registration, email+password login, token refresh, password reset, OTP verification,
      current user. MVP authentication is email+password only — OTP is never passwordless login.
  - name: Users
    description: User profiles and admin user management
  - name: Companies
    description: Shipper and transporter company profiles
  - name: Trucks
    description: Transporter fleet registration
  - name: Loads
    description: Shipper load posting and lifecycle
  - name: Quotations
    description: Transporter quotations against loads
  - name: Bookings
    description: Booking pending then confirm with payment arrangement
  - name: Payments
    description: Payment arrangements and records (MVP records only)
  - name: ProofOfDelivery
    description: Transporter POD uploads
  - name: DeliveryConfirmation
    description: Shipper delivery acceptance (distinct from POD)
  - name: Ratings
    description: Post-completion ratings
  - name: Admin
    description: Restricted admin provisioning and ops release recording

paths:

  /auth/register:
    post:
      operationId: registerUser
      tags: [Auth]
      summary: Public registration (shipper or transporter only)
      description: |
        Creates a user with role `shipper` or `transporter` only.
        Requests that specify `admin` (or any other role) are rejected with 400.
        Does not authenticate as admin under any circumstance.
        New users start as `pending_verification` and must complete OTP + docs before
        company verification unlocks posting/quoting (QA-010 / QA-006). Tokens may still
        be issued for onboarding flows.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Email+password login (MVP sole login method)
      description: |
        MVP login is **email + password** only. OTP endpoints are for phone/account
        verification after registration — they are **never** a passwordless login path.
        Invalid credentials return a generic 401 (do not reveal whether the email exists).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [Auth]
      summary: Rotate access token using a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [Auth]
      summary: Return the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [Auth]
      summary: Request password-reset email (public; anti-enumeration)
      description: |
        Public endpoint (`security: []`); no preexisting login required.

        Accepts an email address. Always returns the **same** generic `202` body whether or
        not an account exists, whether or not email is deliverable, and whether account-level
        internal throttling suppresses a send. Response **never** includes a reset token,
        user id, or account-existence hint. Observable timing/body/status must not enumerate
        accounts.

        **Delivery:** If a reset is warranted, the opaque single-use token is delivered only
        through the **configured email channel**. This contract does **not** perform a real
        send; implementations stub/queue accordingly. Deliverability failures (bounce, missing
        mailbox, provider outage) are handled **uniformly** with the same `202` — clients
        cannot distinguish them from "no account" or "throttled for this account".

        **Throttling:** Account-specific send suppression (if any) must preserve the generic
        `202` (no distinct status). A legitimate **per-source** abuse guard may return generic
        `429` with the shared `Error` shape when the caller/IP/device exceeds limits — that
        `429` must not encode whether the email belongs to an account.

        Reset tokens have a **finite configured TTL**. Tokens are single-use and consumed
        atomically on successful confirm.

        **Approved with API v0.2.0 publish (2026-11-07; originated as Charlie provisional):**
        TTL = **30 minutes**. See AUTH-NOTES / release notes. Fee payer / live payment APIs remain unresolved.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: |
            Generic acceptance. Identical for existing/unknown emails, deliverability
            failures, and account-level send suppression. Never returns a token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetRequestAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          description: |
            Per-source abuse rate limit (generic). Must not reveal account existence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [Auth]
      summary: Confirm password reset with opaque token (public)
      description: |
        Public endpoint (`security: []`); no preexisting login required.

        Body: opaque reset `token` (from email channel only) + `newPassword` (shared
        `Password` policy). On success: password is changed **once**; the token is marked
        consumed **atomically** (concurrent confirms: at most one succeeds); **all existing
        refresh sessions** for that user are invalidated immediately.

        **Session semantics (approved with API v0.2.0 publish, 2026-11-07; originated as
        Charlie provisional):**
        - All **refresh sessions** for the user are revoked immediately on success.
        - **Access JWTs** are **not** immediately denylisted; they remain usable until
          natural expiry (`AuthTokenResponse.expiresIn`). **Residual access exposure**
          therefore lasts until that access token expires (15 minutes — see `expiresIn`).
          Clients must not treat reset as instant access kill.
        - This endpoint still does not issue new session tokens; client must `/auth/login`
          afterward with the new password.

        Token failures (unknown, expired, already consumed, malformed) return the **same**
        pinned `401` body (`PasswordResetConfirmTokenError`) — clients must not distinguish
        causes. Do not log or echo tokens or passwords.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '200':
          description: Password changed; refresh sessions invalidated; token consumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetConfirmResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: |
            Generic token failure for invalid, expired, consumed, or malformed tokens.
            Body MUST match `PasswordResetConfirmTokenError` exactly (one pinned code and
            message). Implementations must not vary code/message by token state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetConfirmTokenError'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          description: Per-source abuse rate limit (generic)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/users:
    post:
      operationId: provisionAdminUser
      tags: [Admin, Users]
      summary: Provision an admin user (admin-only)
      description: |
        The only path in this contract that creates a user with role `admin`.
        Callers must already hold `admin`. Public signup must never reach this endpoint.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionAdminRequest'
      responses:
        '201':
          description: Admin user created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /users/{userId}:
    get:
      operationId: getUser
      tags: [Users]
      summary: Get a user by id
      description: |
        Self, same-company member, or admin. Non-admins cannot read arbitrary users.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateUser
      tags: [Users]
      summary: Update a user profile
      description: Self may update display fields; admin may also change `accountStatus`. Role cannot be escalated to admin via this endpoint.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /companies:
    get:
      operationId: listCompanies
      tags: [Companies]
      summary: List companies visible to the caller
      description: |
        Shippers/transporters see their own companies. Admins may filter all companies.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/CompanyType'
        - name: verificationStatus
          in: query
          schema:
            $ref: '#/components/schemas/VerificationStatus'
      responses:
        '200':
          description: Paginated companies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createCompany
      tags: [Companies]
      summary: Create a company for the authenticated shipper or transporter
      description: Caller becomes an owner member. Admin may create on behalf of a user via `ownerUserId`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyRequest'
      responses:
        '201':
          description: Company created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /companies/{companyId}:
    get:
      operationId: getCompany
      tags: [Companies]
      summary: Get a company
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          description: Company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateCompany
      tags: [Companies]
      summary: Update a company
      description: Company owner/admin member, or platform admin. Verification status changes are admin-only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyRequest'
      responses:
        '200':
          description: Updated company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /trucks:
    get:
      operationId: listTrucks
      tags: [Trucks]
      summary: List trucks
      description: Transporters see own fleet; shippers may search available verified trucks; admins see all.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: companyId
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: truckType
          in: query
          schema:
            $ref: '#/components/schemas/TruckType'
        - name: verificationStatus
          in: query
          schema:
            $ref: '#/components/schemas/VerificationStatus'
        - name: availableOn
          in: query
          description: Filter trucks marked available on this date (YYYY-MM-DD)
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Paginated trucks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TruckListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createTruck
      tags: [Trucks]
      summary: Register a truck under a transporter company
      description: Caller must be a member of the transporter company (or admin).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTruckRequest'
      responses:
        '201':
          description: Truck created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Truck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /trucks/{truckId}:
    get:
      operationId: getTruck
      tags: [Trucks]
      summary: Get a truck
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TruckId'
      responses:
        '200':
          description: Truck
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Truck'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateTruck
      tags: [Trucks]
      summary: Update a truck
      description: Owning transporter company member or admin. Verification status is admin-only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TruckId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTruckRequest'
      responses:
        '200':
          description: Updated truck
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Truck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /loads:
    get:
      operationId: listLoads
      tags: [Loads]
      summary: List loads
      description: |
        Shippers see own loads. Transporters see posted (and later) loads for quoting.
        Admins see all. Optional filters support transporter matching by truck type,
        weight/capacity band, pickup/destination text, and loading date range (QA-009).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/LoadStatus'
        - name: companyId
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: pickupDateFrom
          in: query
          schema:
            type: string
            format: date
        - name: pickupDateTo
          in: query
          schema:
            type: string
            format: date
        - name: truckTypeRequired
          in: query
          description: Filter by required truck type (QA-009)
          schema:
            $ref: '#/components/schemas/TruckType'
        - name: minWeightKg
          in: query
          description: Minimum load weightKg inclusive (capacity/matching filter, QA-009)
          schema:
            type: integer
            minimum: 1
        - name: maxWeightKg
          in: query
          description: Maximum load weightKg inclusive (QA-009)
          schema:
            type: integer
            minimum: 1
        - name: pickupText
          in: query
          description: Case-insensitive substring match on pickupAddress (route filter, QA-009)
          schema:
            type: string
            maxLength: 200
        - name: destinationText
          in: query
          description: Case-insensitive substring match on destinationAddress (QA-009)
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: Paginated loads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createLoad
      tags: [Loads]
      summary: Create a load in draft (shipper)
      description: |
        Creates `draft` only. Posting requires verified shipper company (see `postLoad`, QA-006).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLoadRequest'
      responses:
        '201':
          description: Load created as draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Load'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /loads/{loadId}:
    get:
      operationId: getLoad
      tags: [Loads]
      summary: Get a load
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LoadId'
      responses:
        '200':
          description: Load
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Load'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateLoad
      tags: [Loads]
      summary: Update a draft or posted load (shipper owner)
      description: |
        Shipper owning company may edit while status is `draft` or `posted` (before a booking
        is pending/confirmed). Admins may edit for operational fixes. Status transitions that
        post/cancel/close use dedicated action endpoints where defined.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LoadId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLoadRequest'
      responses:
        '200':
          description: Updated load
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Load'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /loads/{loadId}/post:
    post:
      operationId: postLoad
      tags: [Loads]
      summary: Transition load from draft to posted
      description: |
        Makes the load visible for transporter quotations.
        **Verification gate (QA-006):** shipper company `verificationStatus` must be `verified`
        and calling user's `accountStatus` must be `active`; otherwise 403 with verify-needed semantics.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LoadId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Load posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Load'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /loads/{loadId}/cancel:
    post:
      operationId: cancelLoad
      tags: [Loads]
      summary: Cancel a load
      description: |
        Allowed for shipper owner while no confirmed booking exists.
        After booking confirmation, use admin `POST /bookings/{bookingId}/cancel` to record
        cancellation (QA-004 provisional Charlie policy — not user-approved). This load
        endpoint returns 409 when a confirmed booking exists.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LoadId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelReasonRequest'
      responses:
        '200':
          description: Load cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Load'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /loads/{loadId}/quotations:
    get:
      operationId: listQuotationsForLoad
      tags: [Quotations]
      summary: List quotations for a load
      description: Shipper owner and admin see all; transporters see only their own quotations.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LoadId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated quotations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotationListResponse'
        '401':
