  /bookings/{bookingId}/cancel:
    post:
      operationId: cancelBooking
      tags: [Bookings, Admin]
      summary: Admin-only booking cancellation record (QA-004 provisional)
      description: |
        Admin records cancellation of a `confirmed` booking, including **after collection**
        (user-approved 2026-11-07). Creates an audit trail.
        **Admin-only, pending included (user-approved 2026-11-10):** after a quotation is
        accepted, a booking (including `pending_payment_arrangement`) can only be cancelled
        here, by an admin, with an audited `reason`. A shipper or transporter member of the
        booking calling this endpoint receives **409** `SelfCancelNotAllowedError`
        (`code: SELF_CANCEL_NOT_ALLOWED`); other non-admin callers get 403/404. Recording a
        cancellation never creates an off-platform report, finding, or ban by itself — a
        suspected circumvention is reported separately (`createOffPlatformReport`). Does not automate refunds or
        move funds. Refund recording remains a separate path and is not retagged here.
        Commission is not charged when cancelled before completion. Pair with
        `POST /payment-arrangements/{id}/refunds` when a refund audit record is required.
        Shipper load `cancel` remains 409 once booking is confirmed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelBookingRequest'
      responses:
