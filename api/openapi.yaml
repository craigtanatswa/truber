          maxLength: 1000

    AcceptQuotationResponse:
      type: object
      required: [quotation, booking]
      properties:
        quotation:
          $ref: '#/components/schemas/Quotation'
        booking:
          $ref: '#/components/schemas/Booking'

    BookingStatus:
      type: string
      enum:
        - pending_payment_arrangement
        - confirmed
        - cancelled
      description: |
        `pending_payment_arrangement` after quotation accept. `confirmed` only after
        server-confirmed payment arrangement (and escrow protection when required).

    TripStatus:
      type: string
      enum:
        - not_started
        - truck_dispatched
        - goods_collected
        - in_transit
        - delivered
      description: Operational progress. `delivered` is transporter assertion only.

    CompletionStatus:
      type: string
      enum:
        - not_complete
        - awaiting_shipper_acceptance
        - completed
        - disputed
        - locked
        - cancelled
      description: |
        Trip completion is distinct from transporter `delivered` and from payment release.
        On shipper delivery acceptance (with POD present), status becomes `completed`
        (user decision 2026-11-11) and a 24-hour dispute window opens
        (`Booking.disputeWindowEndsAt`).
        `locked` (v0.5.0): the window closed with no dispute, or an admin resolved a dispute.
        Commission is final; no void or cancel is possible, only admin adjustments
        (`recordBookingAdjustment`). The server treats `completed` with
        `disputeWindowEndsAt <= now` as `locked` on every read and write.
        Release remains a separate admin/ops recording step and must not redefine completion.
        **Commission (user-approved 2026-11-09):** 5% is recognised when status becomes
        `completed`, not when payment is released.
        `disputed` holds release until the dispute is settled by the parties or resolved by
        an admin (QA-005). An open dispute keeps the trip unlocked and commission not final,
        even after `disputeWindowEndsAt`.
        `awaiting_release` was removed in v0.2.0 as unsafe conflation with completion.

    Booking:
      type: object
      required:
        - id
        - loadId
        - quotationId
        - shipperCompanyId
        - transporterCompanyId
        - status
        - tripStatus
        - completionStatus
        - agreedAmount
        - commissionRateBps
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        loadId:
          $ref: '#/components/schemas/Uuid'
        quotationId:
          $ref: '#/components/schemas/Uuid'
        shipperCompanyId:
          $ref: '#/components/schemas/Uuid'
        transporterCompanyId:
          $ref: '#/components/schemas/Uuid'
        truckId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/BookingStatus'
        tripStatus:
          $ref: '#/components/schemas/TripStatus'
        completionStatus:
          $ref: '#/components/schemas/CompletionStatus'
        agreedAmount:
          allOf:
            - $ref: '#/components/schemas/PositiveMoneyAmount'
          description: |
            **Canonical agreed price** (v0.5.0). Set from the accepted quotation amount and
            immutable after accept. The shipper pays this in full. Commission recognition,
            `getBookingPayoutBreakdown`, and release records all use this value;
            `PaymentReleaseRecord.tripAmount` is a copy of it.
        commissionRateBps:
          type: integer
          description: Commission in basis points; MVP fixed at 500 (5.00%)
          enum: [500]
        adjustedAgreedAmount:
          type: object
          nullable: true
          readOnly: true
          required: [amountMinor, currency]
          properties:
            amountMinor:
              type: integer
              minimum: 0
            currency:
              $ref: '#/components/schemas/CurrencyCode'
          description: |
            v0.5.0. Effective agreed amount after the latest admin adjustment or
            `adjust_amount` dispute resolution; null when never adjusted. `agreedAmount`
            itself is never rewritten. Commission, payout breakdown and release use this value
            when set. `0` means the trip was fully reversed.
        deliveryConfirmedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: v0.5.0. When the shipper accepted delivery and the trip became `completed`.
        disputeWindowEndsAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: |
            v0.5.0. Exactly `deliveryConfirmedAt` + 24 hours, server-set. The shipper may call
            `raiseBookingDispute` only before this time.
        lockedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: |
            v0.5.0. When the trip locked: `disputeWindowEndsAt` if no dispute was raised, or
            the time the dispute was settled by the parties or resolved by an admin.
            Commission is final from here.
        confirmedPaymentArrangementId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          type: string
          nullable: true
          description: Set when booking becomes confirmed; references the confirming arrangement.
        confirmedAt:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          type: string
          nullable: true
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'

    BookingListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Booking'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

