        arrangementStatus:
          $ref: '#/components/schemas/ArrangementStatus'
        protectionStatus:
          $ref: '#/components/schemas/ProtectionStatus'
        releaseStatus:
          $ref: '#/components/schemas/ReleaseStatus'
        totalAmount:
          $ref: '#/components/schemas/PositiveMoneyAmount'
        depositAmount:
          allOf:
            - $ref: '#/components/schemas/MoneyAmount'
