          nullable: true
          maxLength: 2000
        uploadedByUserId:
          $ref: '#/components/schemas/Uuid'
        createdAt:
          $ref: '#/components/schemas/DateTime'

    CreateProofOfDeliveryRequest:
      type: object
      description: |
        QA-008 schema-enforced non-vacuous POD (not prose-only). Instance must satisfy
        `anyOf`: (A) nonempty `photoUris` with each entry a non-blank `uri`, or
        (B) non-blank `recipientConfirmationNote` (recipient confirmation). Both may be
        present. Optional supporting fields: `deliveryNoteReference`, `recipientName`.
        Empty `{}`, empty file lists, blank confirmation, and malformed/blank URIs are invalid.
      properties:
        deliveryNoteReference:
          type: string
          minLength: 1
          maxLength: 200
        photoUris:
          type: array
          description: File evidence URIs; emptiness alone does not satisfy anyOf.
          items:
            type: string
            format: uri
            minLength: 1
            description: Absolute http(s) URI for a POD file/photo
            pattern: '^https?://\S+$'
          maxItems: 20
        recipientName:
          type: string
          minLength: 1
          maxLength: 200
        recipientConfirmationNote:
          type: string
          maxLength: 2000
      anyOf:
        - type: object
          required: [photoUris]
          properties:
            photoUris:
              type: array
              minItems: 1
              maxItems: 20
              items:
                type: string
                format: uri
                minLength: 1
                description: Absolute http(s) URI for a POD file/photo
                pattern: '^https?://\S+$'
        - type: object
          required: [recipientConfirmationNote]
          properties:
            recipientConfirmationNote:
              type: string
              minLength: 1
              maxLength: 2000
              pattern: '^.*\S.*$'

