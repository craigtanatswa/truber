  /bookings/{bookingId}/confirm:
    post:
      operationId: confirmBooking
      tags: [Bookings]
      summary: Confirm booking after payment arrangement is server-confirmed
      description: |
        Transitions booking from `pending_payment_arrangement` to `confirmed` **only if**
        there exists a payment arrangement for this booking with `arrangementStatus=confirmed`
        and method-specific protection rules satisfied. **Payment gate is absolute.**

        **Actor authority (fixes unsafe v0.1.0 ambiguity):**
        - Primary actor: shipper company member on the booking.
        - Admin may call with `auditOverride` reason in the body for operational assistance,
          but admin **never bypasses** the arrangement-confirmed / escrow-protected gates
          (provisional Charlie policy §3 — not user-approved). Override creates an audit record.

        Method rules:
        - `cash`: arrangement confirmed; `protectionStatus` stays `none`.
        - `prepay`: arrangement confirmed; deposit receipt N/A.
        - `deposit_balance`: arrangement confirmed only after deposit **receipt** recorded
          (provisional §4); split amounts configurable (no fixed 50/50).
        - `corporate_credit`: arrangement confirmed only if credit account approved and
          atomic capacity reservation succeeds (QA-011 / provisional §4).
        - `escrow`: arrangement confirmed **and** `protectionStatus=protected` with
          independent-provider evidence (admin/ops recorded — not client claim).

        Clients cannot set payment/protection flags. Race-safe via Idempotency-Key.
        **Commission owing gate (user-approved 2026-11-09):** if the booking's transporter
        company has unpaid commission outstanding in any currency, return **409**
        `CommissionOutstandingError` (pinned `code: COMMISSION_OUTSTANDING`; required
        `details.outstandingByCurrency`; `details.outstandingAmount` also required when
        owing is in exactly one currency). Do not confirm the booking. This blocks new
        business for a transporter who still owes; existing already-confirmed bookings
        are unaffected. Admin `auditOverride` cannot bypass this gate. Same gate as
        `createQuotation` and `acceptQuotation`.
        **Off-platform ban gate (user-approved 2026-11-10):** if the calling user, the booking's shipper company, or the
        booking's transporter company has an active
        off-platform ban (`startsAt <= now < endsAt`, not lifted), return **409**
        `AccountBannedError` (`code: ACCOUNT_BANNED`, required `details.bannedUntil`).
        Existing records stay visible. Checked before the commission-owing gate.
        Admin `auditOverride` cannot bypass the ban. A pending booking blocked by a ban
        stays `pending_payment_arrangement`; only admin may cancel it (`cancelBooking`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmBookingRequest'
      responses:
        '200':
          description: Booking confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Missing confirmed arrangement, escrow not protected, invalid state, an active
            off-platform ban, or unpaid commission owing. A ban must use
            `AccountBannedError` (`code: ACCOUNT_BANNED`, required `details.bannedUntil`;
            user-approved 2026-11-10). Owing must use `CommissionOutstandingError`
            (`code: COMMISSION_OUTSTANDING`, required `details.outstandingByCurrency`;
            `details.outstandingAmount` also required when owing is in one currency).
            Other conflicts use `OtherConflictError` (generic `Error` shape with any code
            except the pinned ones).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CommissionOutstandingError'
                  - $ref: '#/components/schemas/AccountBannedError'
                  - $ref: '#/components/schemas/OtherConflictError'

  /bookings/{bookingId}/payout-breakdown:
    get:
      operationId: getBookingPayoutBreakdown
      tags: [Bookings, Payments]
      summary: Get the transporter payout breakdown for a booking
      description: |
        **v0.5.0.** Read-only, server-computed view of how the booking's
        agreed amount splits into Truber commission, recorded fees, and the transporter net
        payout. Records only; does not move funds and does not request a release.

        **Canonical amount:** `agreedAmount` is `Booking.agreedAmount` (the shipper pays it in
        full). It is the single source for commission and net. Release records copy it as
        `tripAmount` when they are written.

        - `commissionAmount` = half-up 5% of `agreedAmount` (`commissionRateBps` 500). Once the
          trip is completed this equals the recognised `CommissionReceivable.amount`.
        - `fees` lists **recorded** processing fees only (from `recordPaymentTransaction`), in
          the booking currency. No estimated or provider-published rate is included.
        - `netPayout = agreedAmount − commissionAmount − feesTotal`. This read never returns
          409: if the net would be negative, the response is 200 with `netPayout` null and
          `net_payout_negative` in `payoutBlockedReasons`. Write operations
          (`recordPaymentRelease`) keep their 409 `NET_PAYOUT_NEGATIVE`.
        - `cash`: never payment-protected (`paymentProtected` false); no fare payout is due
          through Truber (`farePayoutDueThroughTruber` false, `netPayout` null); the
          commission stays an open receivable until `recordCommissionCollection`.
        - `corporate_credit`: `payoutBlockedReasons` contains `shipper_payment_not_recorded`
          until the shipper payment is recorded.
        - `deposit_balance`: an unreceipted remainder is not payable;
          `payoutBlockedReasons` contains `balance_not_receipted` until it is receipted.
        - Truber never lends: no reason other than a recorded shipper payment unblocks payout.

        **Access:** members of the booking's transporter company, and admin. Everyone else,
        **including the shipper**, gets 404 (the shipper already sees `agreedAmount` on
        `getBooking`; commission and transporter fees are the transporter's commercial terms).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Payout breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingPayoutBreakdown'
              examples:
                cash:
                  summary: Cash trip, completed; commission owed as a receivable, no fare payout
                  value:
                    bookingId: 6f1c2a3e-1b2c-4d5e-8f90-0a1b2c3d4e01
                    transporterCompanyId: 7a2d3b4f-2c3d-4e5f-9a01-1b2c3d4e5f02
                    agreedAmount: { amountMinor: 80000, currency: USD }
                    commissionRateBps: 500
                    commissionAmount: { amountMinor: 4000, currency: USD }
                    commissionStatus: open
                    fees: []
                    feesTotal: { amountMinor: 0, currency: USD }
                    netPayout: null
                    paymentMethod: cash
                    paymentArrangementId: 8b3e4c5a-3d4e-4f60-8b12-2c3d4e5f6a03
                    paymentProtected: false
                    farePayoutDueThroughTruber: false
                    releaseStatus: not_applicable
                    payoutBlockedReasons: [cash_fare_not_held]
                    fundsMovementClaimedByTruber: false
                    computedAt: '2026-11-10T11:00:00Z'
                creditBlocked:
                  summary: Corporate credit, completed; blocked until the shipper payment is recorded
                  value:
                    bookingId: 6f1c2a3e-1b2c-4d5e-8f90-0a1b2c3d4e11
                    transporterCompanyId: 7a2d3b4f-2c3d-4e5f-9a01-1b2c3d4e5f02
                    agreedAmount: { amountMinor: 200000, currency: USD }
                    commissionRateBps: 500
                    commissionAmount: { amountMinor: 10000, currency: USD }
                    commissionStatus: open
                    fees: []
                    feesTotal: { amountMinor: 0, currency: USD }
                    netPayout: { amountMinor: 190000, currency: USD }
                    paymentMethod: corporate_credit
                    paymentArrangementId: 8b3e4c5a-3d4e-4f60-8b12-2c3d4e5f6a13
                    paymentProtected: false
                    farePayoutDueThroughTruber: true
                    releaseStatus: not_applicable
                    payoutBlockedReasons: [shipper_payment_not_recorded]
                    fundsMovementClaimedByTruber: false
                    computedAt: '2026-11-10T11:00:00Z'
                netPayoutNegative:
                  summary: Recorded fees exceed what is left after commission; 200 with null net, no 409
                  value:
                    bookingId: 6f1c2a3e-1b2c-4d5e-8f90-0a1b2c3d4e21
                    transporterCompanyId: 7a2d3b4f-2c3d-4e5f-9a01-1b2c3d4e5f02
                    agreedAmount: { amountMinor: 1000, currency: USD }
                    commissionRateBps: 500
                    commissionAmount: { amountMinor: 50, currency: USD }
                    commissionStatus: open
                    fees:
                      - feeType: processing_fee
                        amount: { amountMinor: 980, currency: USD }
                        transactionId: 9c4f5d6b-4e5f-4a71-9c23-3d4e5f6a7b24
                    feesTotal: { amountMinor: 980, currency: USD }
                    netPayout: null
                    paymentMethod: prepay
                    paymentArrangementId: 8b3e4c5a-3d4e-4f60-8b12-2c3d4e5f6a23
                    paymentProtected: false
                    farePayoutDueThroughTruber: true
                    releaseStatus: held
                    payoutBlockedReasons: [net_payout_negative]
                    fundsMovementClaimedByTruber: false
                    computedAt: '2026-11-10T11:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

