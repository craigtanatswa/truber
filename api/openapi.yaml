  /bookings/{bookingId}/disputes/resolve:
    post:
      operationId: resolveBookingDispute
      tags: [Admin, DeliveryConfirmation]
      summary: Admin resolve delivery dispute with audit (QA-005)
      description: |
        When `completionStatus=disputed` (raised at delivery confirmation, or inside the
        24-hour window with `raiseBookingDispute`) and the parties have not settled, admin
        decides using both sides' evidence. Allowed once the open dispute is
        `transporter_responded`, or `awaiting_transporter_response` with `responseDueAt`
        passed (the admin then decides on what is there); otherwise 409
        `DISPUTE_RESPONSE_WINDOW_OPEN` (a decision at exactly `responseDueAt` is allowed). The dispute becomes `resolved` with `outcome` and
        `reason`, both visible to both parties, and `dispute_resolved` is sent to both.
        Resolution is audited and final: the trip does not get a new dispute window. Does
        not move funds.
        - `complete_trip`: `completionStatus` → `locked`. If no commission receivable exists
          yet, the server creates the same open 5% receivable as `confirmDelivery` accepted.
          Release recording becomes eligible.
        - `adjust_amount` (requires `adjustedAgreedAmount`, same currency, lower than the
          current effective agreed amount; `0` reverses the trip): `completionStatus` →
          `locked` and the server records a `CommissionAdjustment` (`source: admin_decision`)
          exactly as `recordBookingAdjustment` does (commission follows the money; paid
          commission above the new figure becomes credit, never refunded in cash). If no
          receivable exists yet, it
          is recognised on the adjusted amount instead.
        - `cancel_trip`: `completionStatus` → `cancelled`; release stays blocked. The
          receivable for this booking is `voided`; any part already collected, settled, or
          paid with credit becomes commission credit (never refunded in cash).
        A dispute on a `locked` trip is not reopened here: admins use
        `recordBookingAdjustment`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveDisputeRequest'
      responses:
        '200':
          description: Dispute resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisputeResolutionRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /bookings/{bookingId}/disputes:
    get:
      operationId: listBookingDisputes
      tags: [Bookings, DeliveryConfirmation]
      summary: List disputes on a booking (both parties and admin)
      description: |
        **User decision 2026-11-11.** Both booking parties and admins see every dispute on
        the booking, including the other side's evidence, any offers, and the outcome with
        its reason. Non-parties get 404. Never includes commission or payout figures.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Disputes, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDisputeListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: raiseBookingDispute
      tags: [Bookings, DeliveryConfirmation]
      summary: Shipper opens a dispute on a completed trip inside the 24-hour window
      description: |
        **User decision 2026-11-11.** A shipper member of the booking opens a dispute while
        `completionStatus=completed` and the server time is before
        `Booking.disputeWindowEndsAt`. `completionStatus` → `disputed`: the trip is **not
        locked and commission is not final** while the dispute is open, even after
        `disputeWindowEndsAt`. Release recording returns 409 until the dispute closes.
        The dispute starts in `awaiting_transporter_response` with
        `responseDueAt = openedAt + 48 hours`, and `dispute_opened` is sent to the
        transporter company immediately (root `x-notification-events`). An optional
        `proposedAmount` is the shipper's settlement offer.
        - The window is half-open, `[deliveryConfirmedAt, disputeWindowEndsAt)`: a dispute at
          exactly `disputeWindowEndsAt` or later, or on a `locked` trip, is 409
          `DISPUTE_WINDOW_CLOSED`. Later problems go to support by email and an admin
          records an adjustment (`recordBookingAdjustment`).
        - A dispute already open on the booking: 409 `DISPUTE_ALREADY_OPEN`.
        - Opening a dispute puts the trip's commission receivable in `held` (not final;
          `finalAt` null).
        - Before completion: use `confirmDelivery` with `decision: disputed`, which opens the
          same kind of dispute (409 `TRIP_NOT_COMPLETED` here).
        - Transporter members get 403 (they respond instead; their own issues go to support).
          Non-parties get 404. Admins resolve rather than open.
        Repeated bad-faith disputes can lead to the same 14-day ban as off-platform dealing
        (admin report with `category: repeated_dispute_abuse`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RaiseDisputeRequest'
      responses:
        '201':
          description: Dispute opened; trip is now `disputed`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDispute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /disputes/{disputeId}/response:
    post:
      operationId: respondToDispute
      tags: [Bookings, DeliveryConfirmation]
      summary: Transporter responds with evidence and an optional counter-offer
      description: |
        **User decision 2026-11-11.** A transporter member of the booking responds once,
        while `status=awaiting_transporter_response` and before `responseDueAt`. The response
        carries a statement, evidence (photos, the signed POD, messages) and an optional
        `counterOfferAmount`. Status → `transporter_responded`; `dispute_responded` is sent
        to the shipper company.
        - After `responseDueAt`: 409 `DISPUTE_RESPONSE_WINDOW_CLOSED` (the admin decides on
          what is there).
        - Already responded or dispute closed: 409 `DISPUTE_NOT_AWAITING_RESPONSE`.
        - Shipper members get 403; non-parties 404.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DisputeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespondToDisputeRequest'
      responses:
        '200':
          description: Response recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDispute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /disputes/{disputeId}/settlement:
    post:
      operationId: acceptDisputeSettlement
      tags: [Bookings, DeliveryConfirmation]
      summary: Accept the other side's offer and settle the dispute between the parties
      description: |
        **User decision 2026-11-11.** The parties may settle a dispute themselves while it is
        open (`awaiting_transporter_response` or `transporter_responded`). The shipper
        accepts the transporter's `counterOfferAmount`, or the transporter accepts the
        shipper's `proposedAmount`; `amount` must equal the offer being accepted (409
        `SETTLEMENT_AMOUNT_MISMATCH`; 409 `NO_OFFER_TO_ACCEPT` if the other side made none).
        A party cannot accept its own offer (403).

        Status → `settled`; `completionStatus` → `locked`. When `amount` is lower than the
        current effective agreed amount the server records a `CommissionAdjustment` with
        `source: party_settlement` (offer maker and acceptor recorded as
        `shipperAgreedByUserId` / `transporterAgreedByUserId`) and the same
        commission-follows-money rules as `recordBookingAdjustment` (linked as
        `settlement.adjustmentId`); when equal, the held commission is finalised unchanged and
        no adjustment is recorded. `amount` above the current effective agreed amount is 409
        `ADJUSTMENT_INCREASE_NOT_ALLOWED`; another currency is 409 `CURRENCY_MISMATCH`.
        `dispute_settled` is sent to both parties.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DisputeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptDisputeSettlementRequest'
      responses:
        '200':
          description: Dispute settled by the parties
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDispute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/bookings/{bookingId}/adjustments:
    post:
      operationId: recordBookingAdjustment
      tags: [Admin, Bookings, Payments]
      summary: Record an admin adjustment on a locked trip (reverse or reduce; never an undo)
      description: |
        **User decision 2026-11-11.** Admin-only. After the 24-hour window the trip is
        `locked` and commission is final: there are no voids or cancellations
        (`cancelBooking` returns 409 `COMMISSION_FINAL`), only problems an admin resolves
        (for example a support case by email) and records here as an append-only
        `CommissionAdjustment` with `source: admin_decision`. `Booking.agreedAmount` and the
        receivable `amount` are never rewritten. A second adjustment uses the previous
        adjustment's `newTripAmount` as its baseline.
        - Requires `completionStatus=locked`: 409 `DISPUTE_OPEN` while a dispute is open
          (use `resolveBookingDispute`), 409 `BOOKING_NOT_LOCKED` before lock.
        - `adjustedAgreedAmount` must be in the booking currency (409 `CURRENCY_MISMATCH`)
          and lower than the current effective agreed amount (`Booking.adjustedAgreedAmount`,
          else `Booking.agreedAmount`): higher is 409 `ADJUSTMENT_INCREASE_NOT_ALLOWED`, equal
          is 400. `0` is a full reversal.

        **Commission follows the money:**
        - `newCommission` = half-up 5% of `newTripAmount`;
          `delta = previousCommission − newCommission`.
        - The delta first cancels or reduces this trip's unpaid owing:
          `reducedOpenAmount = min(remainingAmount, delta)`.
        - The rest, `creditedAmount = delta − reducedOpenAmount`, becomes commission credit
          on the transporter company's Truber balance in the same currency
          (`CommissionAccount.creditByCurrency`): credit is applied to future commission and, where server policy allows, to outstanding commission. It is **never paid out or
          refunded in cash**; it is not money held by Truber (no float).
          `fundsMovementClaimedByTruber` is always false.
        - Example: US$1,000 trip, commission US$50 already settled, cut to US$500:
          commission US$25, delta US$25, credited US$25. Same trip on cash with US$50 unpaid:
          US$25 of owing is cancelled and nothing is credited.
        Refunds of the fare itself between shipper and transporter stay outside Truber's
        money flow; record them separately with `recordPaymentRefund` if needed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordBookingAdjustmentRequest'
      responses:
        '201':
          description: Adjustment recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionAdjustment'
              examples:
                reducedSettledTrip:
                  summary: US$1,000 trip cut to US$500 after commission was settled
                  value:
                    id: 7d1c2c60-7b55-4a7e-9a52-2f1d6b1f8a01
                    bookingId: 3f0c3a0e-1d2b-4c5d-8e9f-0a1b2c3d4e5f
                    receivableId: 6c5b4a39-2817-4f6e-9d5c-4b3a29180f7e
                    transporterCompanyId: 9b8a7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                    disputeRef: null
                    source: admin_decision
                    shipperAgreedByUserId: null
                    transporterAgreedByUserId: null
                    decidedAt: '2026-11-20T10:00:00Z'
                    previousTripAmount: {amountMinor: 100000, currency: USD}
                    newTripAmount: {amountMinor: 50000, currency: USD}
                    previousCommission: {amountMinor: 5000, currency: USD}
                    newCommission: {amountMinor: 2500, currency: USD}
                    reducedOpenAmount: {amountMinor: 0, currency: USD}
                    creditedAmount: {amountMinor: 2500, currency: USD}
                    reason: Half the load was rejected at delivery; confirmed by support.
                    recordedByUserId: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                    recordedAt: '2026-11-20T10:00:00Z'
                    fundsMovementClaimedByTruber: false
                cashOwingReduced:
                  summary: Cash trip with US$50 commission unpaid, cut to US$500
                  value:
