    ReleaseChannel:
      type: string
      enum: [manual_ops, provider_api]
      description: |
        `manual_ops` is the MVP path. `provider_api` flags a future capability for when
        an authorised provider exposes release automation — recording with this channel
        still does not claim funds moved via Truber.

    PaymentReleaseRecord:
      type: object
      required:
        - id
        - arrangementId
        - releaseChannel
        - releaseStatus
        - tripAmount
        - commissionAmount
        - transporterNetAmount
        - recordedAt
        - recordedByUserId
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        arrangementId:
          $ref: '#/components/schemas/Uuid'
        releaseChannel:
          $ref: '#/components/schemas/ReleaseChannel'
        releaseStatus:
          $ref: '#/components/schemas/ReleaseStatus'
        tripAmount:
          allOf:
            - $ref: '#/components/schemas/PositiveMoneyAmount'
          description: Completed trip amount used as commission base.
        commissionAmount:
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoneyAmount'
          description: 5% of tripAmount, half-up to the minor unit (approved rounding).
        commissionRateBps:
          type: integer
          enum: [500]
        processingFeesTotal:
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoneyAmount'
          type: object
          nullable: true
          description: Sum of processing fees accounted separately from commission; zero allowed.
        transporterNetAmount:
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoneyAmount'
          description: |
            Server-computed: tripAmount − commissionAmount − processingFeesTotal,
            integer minor units, same currency. Shipper pays the agreed trip amount;
            commission and recorded processing fees are deducted from the transporter
            (user-approved 2026-11-09). For cash, do not book a fare payout due.
            For `deposit_balance`, do not treat an unreceipted balance remainder as payable.
        externalReference:
          type: string
          nullable: true
          maxLength: 200
        notes:
          type: string
          nullable: true
          maxLength: 2000
        fundsMovementClaimedByTruber:
          type: boolean
          enum: [false]
          description: Always false. Release records are audit/ops only in this contract.
        recordedAt:
          $ref: '#/components/schemas/DateTime'
        recordedByUserId:
          $ref: '#/components/schemas/Uuid'

    RecordPaymentReleaseRequest:
      type: object
      description: |
        Admin/ops only. Server returns 409 unless booking `completionStatus=completed`
        (shipper accepted delivery with POD, or admin resolved dispute to completed with
        audit — QA-001/QA-005). Release is held while `disputed`. Manually recorded only;
        never claims Truber moved funds; no float; no live provider API.
        `tripAmount` must be positive; `processingFeesTotal` may be zero (QA-007).
        Server computes `commissionAmount` (half-up 5%). `processingFeesTotal`, if supplied,
        must match the sum of recorded transaction processing fees in the same currency
        (409 if it does not). Mixed currency rejected. 409 if commission + fees would
        make net negative. Corporate-credit payout stays blocked until the shipper
        payment is recorded. For cash, no fare payout due is created and commission
        owing is not settled by this call. For `deposit_balance`, an unreceipted
        balance remainder is not payable (no float / no lending).
      required: [releaseChannel, tripAmount]
      properties:
        releaseChannel:
          $ref: '#/components/schemas/ReleaseChannel'
        tripAmount:
          $ref: '#/components/schemas/PositiveMoneyAmount'
        processingFeesTotal:
          $ref: '#/components/schemas/NonNegativeMoneyAmount'
        externalReference:
          type: string
          maxLength: 200
        notes:
          type: string
          maxLength: 2000

    ProofOfDelivery:
      type: object
      required:
