  /quotations/{quotationId}/accept:
    post:
      operationId: acceptQuotation
      tags: [Quotations, Bookings]
      summary: Accept a quotation and create a pending booking
      description: |
        Shipper owning the load accepts a `submitted` quotation. Server:
        1. Marks quotation `accepted` and sibling open quotations `not_selected`
           (QA-002 quote restore — user-approved 2026-11-07). `not_selected`
           quotes are recoverable if the pending booking fails before confirmation
           (see `POST /loads/{loadId}/quotations/restore-not-selected`).
        2. Creates a booking in status `pending_payment_arrangement`.
        3. Moves load to `booking_pending`.
        Booking is **not** confirmed by this call. Confirmation requires a confirmed payment
        arrangement via `/bookings/{bookingId}/confirm`.
        **Commission owing gate (user-approved 2026-11-09):** if the quotation's transporter
        company has unpaid commission outstanding, return **409**
        `CommissionOutstandingError` (same pinned schema as `createQuotation` and
        `confirmBooking`). Do not create the booking. The transporter may
        still view the load; settle owing before new work is accepted.
        **Off-platform ban gate (user-approved 2026-11-10):** if the calling user, the shipper company, or the quotation's
        transporter company (or the user who submitted the quotation) has an active
        off-platform ban (`startsAt <= now < endsAt`, not lifted), return **409**
        `AccountBannedError` (`code: ACCOUNT_BANNED`, required `details.bannedUntil`).
        Existing records stay visible. Checked before the commission-owing gate.
        Do not create the booking.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/QuotationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptQuotationRequest'
      responses:
        '201':
          description: Pending booking created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptQuotationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/NewWorkGateConflict'

