      operationId: recordPaymentTransaction
      tags: [Payments, Admin]
      summary: Record a payment transaction (admin/ops; MVP records only)
      description: |
        Records that money moved (or failed) according to external proof. Updates
        transaction `paymentStatus` only — does not by itself confirm arrangement,
        protection, booking, or release. Clients cannot mark themselves paid.
      security:
        - bearerAuth: []
