        **No self-cancel (user-approved 2026-11-10):** an `accepted` quotation (a booking
        exists, including `pending_payment_arrangement`) cannot be withdrawn. Return **409**
        `SelfCancelNotAllowedError` (`code: SELF_CANCEL_NOT_ALLOWED`). Only admin may record
