  /auth/otp/request:
    post:
      operationId: requestRegistrationOtp
      tags: [Auth]
      summary: Request OTP for phone/account verification (QA-010)
      description: |
        Sends or re-sends a one-time code for the authenticated or just-registered user for
        **phone/account verification only**. This is **not** passwordless login and does not
        issue session tokens. Does not activate posting privileges by itself. Rate-limited;
        MVP records intent even if SMS/email provider is stubbed (contract does not perform
        a real send).
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  enum: [sms, email]
                  default: sms
      responses:
        '202':
          description: OTP dispatch accepted (or stubbed in non-prod)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/otp/verify:
    post:
      operationId: verifyRegistrationOtp
      tags: [Auth]
      summary: Verify OTP for account verification (QA-010)
      description: |
        Verifies the OTP for **account/phone verification only** — not a login substitute.
        On success moves `accountStatus` from `pending_verification` toward allowing
        document upload; full load-posting still requires company `verified` (QA-006).
        Does not rotate or issue password-reset tokens.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
      responses:
        '200':
          description: OTP accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /verification-documents:
    get:
      operationId: listVerificationDocuments
      tags: [Users, Admin]
      summary: List verification documents for the caller or a company (QA-010)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: companyId
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Document list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationDocumentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: uploadVerificationDocument
      tags: [Users]
      summary: Register a verification document URI (QA-010)
      description: |
        MVP stores metadata + URI reference (no binary multipart in this draft). Admin
        reviews via `POST /admin/verification-documents/{documentId}/review`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVerificationDocumentRequest'
      responses:
        '201':
          description: Document registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/verification-documents/{documentId}/review:
    post:
      operationId: reviewVerificationDocument
      tags: [Admin]
      summary: Admin approve/reject a verification document (QA-010)
      description: |
        May set company/truck `verificationStatus` as a side effect when review policy
        is satisfied. Exact multi-doc completion rules remain an open question.
      security:
        - bearerAuth: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewVerificationDocumentRequest'
      responses:
        '200':
          description: Review recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /loads/{loadId}/quotations/restore-not-selected:
    post:
      operationId: restoreNotSelectedQuotations
      tags: [Quotations]
      summary: Restore not_selected quotations after pending booking failure (QA-002 provisional)
      description: |
        **Provisional Charlie policy — not user-approved.** When a booking in
        `pending_payment_arrangement` is cancelled/expired without confirmation, admin or
        shipper may restore sibling quotations from `not_selected` back to `submitted`
        (eligibility/trigger details still partially open — see unresolved decisions).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LoadId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Restored quotations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'



  /bookings/{bookingId}/cancel:
    post:
      operationId: cancelBooking
      tags: [Bookings, Admin]
      summary: Record post-confirm booking cancellation (QA-004 provisional)
      description: |
        **Provisional Charlie policy — not user-approved.** Admin records cancellation of a
        `confirmed` booking before collection (or per later terms). Creates an audit trail.
        Does not automate refunds or move funds. Commission is not charged when cancelled
        before completion. Pair with `POST /payment-arrangements/{id}/refunds` when a refund
        audit record is required. Shipper load `cancel` remains 409 once booking is confirmed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelBookingRequest'
      responses:
        '200':
          description: Cancellation recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /bookings/{bookingId}/disputes/resolve:
    post:
      operationId: resolveBookingDispute
      tags: [Admin, DeliveryConfirmation]
      summary: Admin resolve delivery dispute with audit (QA-005)
      description: |
        When `completionStatus=disputed`, admin resolves to `completed` or `cancelled`.
        Resolution is audited. Completing unlocks release recording eligibility; cancelling
        keeps release blocked. Does not move funds.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveDisputeRequest'
      responses:
        '200':
          description: Dispute resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisputeResolutionRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /payment-arrangements/{arrangementId}/deposit-receipt:
    post:
      operationId: recordDepositReceipt
      tags: [Payments, Admin]
      summary: Record deposit receipt evidence (required before deposit_balance confirm)
      description: |
        Admin/ops records that a deposit payment was receipted externally. Required before
        confirming a `deposit_balance` arrangement (provisional policy §4). Not a live charge API.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ArrangementId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositReceiptRequest'
      responses:
        '200':
          description: Receipt recorded on arrangement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentArrangement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /payment-arrangements/{arrangementId}/refunds:
    post:
      operationId: recordPaymentRefund
      tags: [Payments, Admin]
      summary: Record a refund audit entry (QA-004 provisional)
      description: |
        **Provisional Charlie policy — not user-approved.** Admin records a refund against
        an arrangement/transactions. Sets/creates transaction with `paymentStatus=refunded`
        as appropriate. **Recording a refund is not moving funds.** No automated provider refund API.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ArrangementId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordRefundRequest'
      responses:
        '201':
          description: Refund record created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRefundRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /companies/{companyId}/credit-account:
    get:
      operationId: getCompanyCreditAccount
      tags: [Companies, Payments]
      summary: Get corporate credit account (QA-011)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          description: Credit account (or empty unapproved shell)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/companies/{companyId}/credit-account:
    put:
      operationId: upsertCompanyCreditAccount
      tags: [Admin, Payments]
      summary: Create/update corporate credit approval and limit (QA-011)
      description: |
        Admin sets approval status, limit, and terms. Arrangements with method
        `corporate_credit` cannot confirm without an `approved` account and successful
        atomic capacity reservation at confirm time.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertCreditAccountRequest'
      responses:
        '200':
          description: Credit account upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token. Claims must include at least `sub` (user id) and `role`
        (`shipper` | `transporter` | `admin`). Refresh tokens are opaque and used only
        with `/auth/refresh`.

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CompanyId:
      name: companyId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    TruckId:
      name: truckId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    LoadId:
      name: loadId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    QuotationId:
      name: quotationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ArrangementId:
      name: arrangementId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    Page:
      name: page
      in: query
      description: 1-based page index
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Page size (max 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Optional on reads; **strongly recommended** (and may be required by server) on
        confirmation and create-once writes. Replays with the same key and equivalent body
        return the original result without re-applying side effects.
      schema:
        type: string
        minLength: 8
        maxLength: 128

  responses:
    BadRequest:
      description: Malformed request or failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found (or not visible)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: State conflict, duplicate, or failed precondition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Semantically invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Uuid:
      type: string
      format: uuid

    DateTime:
      type: string
      format: date-time

    CurrencyCode:
      type: string
      description: ISO 4217 currency code (e.g. USD, ZWG)
      pattern: '^[A-Z]{3}$'
      example: USD

    MoneyAmount:
      type: object
      description: |
        Integer minor units plus ISO 4217 currency. Never floating-point.
        Prefer PositiveMoneyAmount / NonNegativeMoneyAmount on write paths.
        Commission: half-up to minor unit at 500 bps (5%). Fees are separate fields
        (fee payer unresolved — open question).
      required: [amountMinor, currency]
      properties:
        amountMinor:
          type: integer
          description: Minor units; sign/zero rules depend on the referencing schema
        currency:
          $ref: '#/components/schemas/CurrencyCode'

    PositiveMoneyAmount:
      type: object
      description: |
        Strictly positive money (QA-007). Use for quotation amounts, arrangement totals,
        deposits, balances, trip amounts used as commission base.
      required: [amountMinor, currency]
      properties:
        amountMinor:
          type: integer
          minimum: 1
          description: Must be >= 1 minor unit
        currency:
          $ref: '#/components/schemas/CurrencyCode'

    NonNegativeMoneyAmount:
      type: object
      description: |
        Zero or positive money (QA-007). Legitimate zeros allowed for processing fees or
        computed commission only where the trip amount rounds to a representable 5% of 0
        (trip amount itself must still be positive). Never negative.
      required: [amountMinor, currency]
      properties:
        amountMinor:
          type: integer
          minimum: 0
          description: Must be >= 0; zero is meaningful for fees/commission edge cases only
        currency:
          $ref: '#/components/schemas/CurrencyCode'


    PaginationMeta:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-stable error code (e.g. BOOKING_CONFIRM_REQUIRES_ARRANGEMENT)
        message:
          type: string
          description: Human-readable summary
        details:
          type: object
          additionalProperties: true
          description: Optional structured detail
        requestId:
          type: string

    UserRole:
      type: string
      enum: [shipper, transporter, admin]
      description: Public signup allows only shipper or transporter.

    PublicSignupRole:
      type: string
      enum: [shipper, transporter]
      description: Roles permitted on public registration.

    AccountStatus:
      type: string
      enum: [pending_verification, active, suspended, disabled]

    VerificationStatus:
      type: string
      enum: [unverified, pending, verified, rejected]

    Password:
      type: string
      format: password
      minLength: 8
      description: |
        Shared MVP password policy (register, admin provision, password-reset confirm):
        minimum 8 characters. Additional complexity/max-length rules are an open product
        question and must not be invented here. Never log or return password values.

    RegisterRequest:
      type: object
      required: [email, password, fullName, role]
      properties:
        email:
          type: string
          format: email
        password:
          $ref: '#/components/schemas/Password'
        fullName:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          type: string
          maxLength: 32
        city:
          type: string
          minLength: 1
          maxLength: 120
          description: |
            Optional primary city (QA-026). Omit when unknown — absence is valid.
            No fabricated default; not required for registration.
        role:
          $ref: '#/components/schemas/PublicSignupRole'

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          description: Submitted password (not validated for minLength on login to avoid policy leakage via length probes).

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: Opaque refresh token; never log in full.

    ProvisionAdminRequest:
      type: object
      required: [email, password, fullName]
      properties:
        email:
          type: string
          format: email
        password:
          $ref: '#/components/schemas/Password'
        fullName:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          type: string
          maxLength: 32

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 320
          pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
          description: |
            Target address; existence is never revealed by the response.
            Pattern supplements `format: email` so empty/malformed values fail schema
            validation under OAS instance validators that soft-handle format alone.

    PasswordResetRequestAccepted:
      type: object
      additionalProperties: false
      description: |
        Uniform acceptance payload (QA-027). Only `status` + pinned `message` are allowed —
        undeclared keys (token, userId, accessToken, etc.) are schema-invalid.
        Identical for all account/deliverability outcomes (anti-enumeration).
      required: [status, message]
      properties:
        status:
          type: string
          enum: [accepted]
        message:
          type: string
          enum:
            - If an account exists for this email, password reset instructions will be sent when permitted.

    PasswordResetToken:
      type: string
      minLength: 32
      maxLength: 512
      pattern: '^\S+$'
      description: |
        Opaque single-use reset token delivered only via configured email. Never returned by
        request endpoint; never log plaintext.
        **Approved with API v0.2.0 publish (2026-11-07):** TTL 30 minutes.

    PasswordResetConfirmRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          $ref: '#/components/schemas/PasswordResetToken'
        newPassword:
          $ref: '#/components/schemas/Password'

    PasswordResetConfirmResponse:
      type: object
      additionalProperties: false
      description: |
        Confirm success payload (QA-027). Only documented fields; undeclared keys
        (accessToken, refreshToken, token, etc.) are schema-invalid. Does not issue sessions.
      required: [status, refreshSessionsInvalidated]
      properties:
        status:
          type: string
          enum: [password_changed]
        refreshSessionsInvalidated:
          type: boolean
          enum: [true]
          description: Always true on success — all refresh sessions for the user are revoked.

    PasswordResetConfirmTokenError:
      type: object
      additionalProperties: false
      description: |
        Dedicated confirm-401 body (QA-028). Explicit schema — not a composition with
        generic `Error` — so `details` / free-form codes cannot leak token state.
        Unknown, expired, consumed, and malformed tokens MUST use this exact `code` and
        `message` (OpenAPI 3.0 singleton enums). Generic `Error` elsewhere is unchanged.
      required: [code, message]
      properties:
        code:
          type: string
          enum: [PASSWORD_RESET_TOKEN_INVALID]
        message:
          type: string
          enum:
            - Password reset token is invalid or no longer usable.

    AuthTokenResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          minimum: 1
          description: |
            Access token lifetime in seconds from issuance.
            **Approved with API v0.2.0 publish (2026-11-07; originated as Charlie provisional):**
            **900** (15 minutes). After password reset, refresh is revoked but access JWTs
            issued earlier remain valid until this natural expiry (residual exposure window).
            Do not treat other text as implying immediate access revocation.
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      required: [id, email, fullName, role, accountStatus, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          type: string
          format: email
        fullName:
          type: string
        phone:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/UserRole'
        accountStatus:
          $ref: '#/components/schemas/AccountStatus'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'

    UpdateUserRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          type: string
          maxLength: 32
          nullable: true
        accountStatus:
          allOf:
            - $ref: '#/components/schemas/AccountStatus'
          description: Admin-only when changing another user.

    CompanyType:
      type: string
      enum: [shipper, transporter]

    Company:
      type: object
      required:
        - id
        - type
        - legalName
        - verificationStatus
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        type:
          $ref: '#/components/schemas/CompanyType'
        legalName:
          type: string
        tradingName:
          type: string
          nullable: true
        registrationNumber:
          type: string
          nullable: true
        taxNumber:
          type: string
          nullable: true
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2
          example: ZW
        city:
          type: string
          nullable: true
          minLength: 1
          maxLength: 120
          description: |
            Optional primary city (QA-026). Null/omitted when unknown — no fabricated default.
        verificationStatus:
          $ref: '#/components/schemas/VerificationStatus'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'

    CreateCompanyRequest:
      type: object
      required: [type, legalName]
      properties:
        type:
          $ref: '#/components/schemas/CompanyType'
        legalName:
          type: string
          minLength: 1
          maxLength: 200
        tradingName:
          type: string
          maxLength: 200
        registrationNumber:
          type: string
          maxLength: 100
        taxNumber:
          type: string
          maxLength: 100
        countryCode:
          type: string
          default: ZW
        city:
          type: string
          minLength: 1
          maxLength: 120
          description: |
            Optional primary city (QA-026). Omit when unknown; absence is valid.
        ownerUserId:
          allOf:
            - $ref: '#/components/schemas/Uuid'
          description: Admin-only override; default is the authenticated user.

    UpdateCompanyRequest:
      type: object
      properties:
        legalName:
          type: string
          minLength: 1
          maxLength: 200
        tradingName:
          type: string
          maxLength: 200
          nullable: true
        registrationNumber:
          type: string
          maxLength: 100
          nullable: true
        taxNumber:
          type: string
          maxLength: 100
          nullable: true
        city:
          type: string
          nullable: true
          minLength: 1
          maxLength: 120
          description: |
            Optional primary city (QA-026). Set null to clear; omit to leave unchanged.
            No fabricated default when omitted.
        verificationStatus:
          allOf:
