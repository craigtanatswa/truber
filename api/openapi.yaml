        counterpartyRestrictedUntil:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: |
            User decision 2026-11-11 (the other party is told when someone is banned).
            Server-computed per caller: the latest `endsAt` of active off-platform bans on
            the caller's counterparty for this quotation, or null when none is active.
            Shipper-side callers see the quotation's transporter company (or submitting
            user); transporter-side callers see the load's shipper company. Always null for
            admins (they use `listOffPlatformBans`). A non-null value means
            `acceptQuotation` / `confirmBooking` would return 409 `ACCOUNT_BANNED` with
            `bannedParty: counterparty_company`. Date-time only: no reason, finding, report,
            evidence, or reporter is disclosed. See `x-notification-events`.

