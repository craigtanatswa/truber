          $ref: '#/components/schemas/TripStatus'
        note:
          type: string
          maxLength: 1000

    PaymentMethod:
      type: string
      enum:
        - prepay
        - escrow
        - deposit_balance
        - cash
        - corporate_credit
      description: |
        `cash` is never payment-protected. `escrow` requires independent-provider evidence
