# Reproducible PostGIS for local development.
# The API process runs on the host by default (see README) so tests can use the
# same database port. The api service is optional and stays off production mode.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: truber
      POSTGRES_PASSWORD: truber
      POSTGRES_DB: truber
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truber -d truber"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - truber_pg:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      BIND_HOST: 0.0.0.0
      DATABASE_URL: postgres://truber:truber@db:5432/truber
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      DELIVERY_ADAPTER: dev
      JWT_ACCESS_TTL_SECONDS: 1800
      RESET_TOKEN_TTL_SECONDS: 1800
    ports:
      - "3000:3000"

volumes:
  truber_pg:
