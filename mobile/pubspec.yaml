name: truber_app
description: Truber client — Connecting Cargo. Moving Business.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  truber_design:
    path: ../design
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  intl: ^0.19.0
  shared_preferences: ^2.5.3
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1
  fake_async: ^1.3.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app-icon-1024.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/brand/adaptive-foreground.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#000000"
  color_dark: "#000000"
  image: assets/brand/splash-mark.png
  image_dark: assets/brand/splash-mark.png
  android_12:
    color: "#000000"
    image: assets/brand/splash-mark.png
    icon_background_color: "#000000"

flutter:
  uses-material-design: true
  assets:
    - assets/brand/mark-black.png
    - assets/brand/mark-white.png
    - assets/brand/wordmark-black.png
    - assets/brand/wordmark-white.png
    - assets/brand/mark-black@2x.png
    - assets/brand/mark-white@2x.png
    - assets/brand/wordmark-black@2x.png
    - assets/brand/wordmark-white@2x.png
    - assets/brand/splash-mark.png
